<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>KOA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: #1C130D radial-gradient(700px 380px at 50% 30%, rgba(232, 106, 44, 0.14), transparent 65%);
    color: #F5EDE0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
  }
  img { width: 84px; height: 84px; }
  h1 { font-size: 30px; letter-spacing: 0.28em; font-weight: 700; }
  form { width: min(640px, 94vw); display: flex; }
  .aiwrap {
    --mx: 50%; --my: 50%; --glow: 0;
    flex: 1; border-radius: 24px; padding: 1.5px;
    background:
      radial-gradient(circle 130px at var(--mx) var(--my),
        rgba(255, 170, 80, calc(0.95 * var(--glow))) 0%,
        rgba(232, 106, 44, calc(0.55 * var(--glow))) 42%,
        rgba(232, 106, 44, 0) 72%),
      #1f130c;
    box-shadow: 0 0 26px rgba(232, 106, 44, calc(0.35 * var(--glow)));
  }
  .aiwrap.zen-on {
    background:
      radial-gradient(circle 175px at var(--mx) var(--my),
        rgba(255, 190, 110, calc(1 * var(--glow))) 0%,
        rgba(232, 106, 44, calc(0.75 * var(--glow))) 45%,
        rgba(232, 106, 44, 0) 75%),
      #241610;
    box-shadow: 0 0 44px rgba(232, 106, 44, calc(0.55 * var(--glow)));
  }
  .bar-row { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 0; }
  .bar-row input {
    flex: 1; min-width: 0; height: 52px;
    border: none; background: rgba(0, 0, 0, 0.55); color: #F5EDE0;
    font-size: 16.5px; padding: 0 22px; outline: none; border-radius: 20px;
  }
  .bar-row input:focus { box-shadow: 0 0 0 3px rgba(232, 106, 44, 0.16); }
  #zenmode {
    flex-shrink: 0; height: 52px; padding: 0 22px;
    border-radius: 18px; border: 1px solid rgba(232, 106, 44, 0.65);
    background: linear-gradient(180deg, #E86A2C, #C63F1B);
    color: #2A1C12; font-family: inherit; font-size: 13.5px; font-weight: 800;
    letter-spacing: 0.08em; cursor: pointer; white-space: nowrap;
  }
  #zenmode:disabled { opacity: 0.55; cursor: default; }
  #zen-answer {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 0.55s ease, opacity 0.4s ease, margin 0.4s ease;
    margin: 0 8px;
  }
  #zen-answer.open { max-height: 340px; opacity: 1; margin: 2px 8px 8px 8px; }
  #zen-answer .who {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em;
    color: #E8A83C; margin-bottom: 6px;
  }
  #zen-text {
    font-size: 14px; line-height: 1.6; color: #F5EDE0;
    max-height: 190px; overflow-y: auto; white-space: pre-wrap;
  }
  #zen-text .caret::after { content: "▍"; color: #E86A2C; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #zen-err { font-size: 13px; color: #bf616a; margin-top: 6px; }
  #zen-err:empty { display: none; }
  .zen-actions { display: flex; gap: 8px; margin-top: 10px; }
  .zen-actions button {
    flex: 1; height: 38px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700;
  }
  #zen-continue { background: #E86A2C; border: none; color: #2A1C12; }
  #zen-google { background: transparent; border: 1px solid #6B4A2E; color: #F5EDE0; }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tiles a {
    color: #B9A58C; text-decoration: none; font-size: 13px; font-weight: 600;
    border: 1px solid #6B4A2E; border-radius: 8px; padding: 9px 16px;
    background: rgba(62, 42, 26, 0.5);
  }
  .tiles a:hover { color: #E86A2C; border-color: #E86A2C; }
</style>
</head>
<body>
  <img src="logo.png" alt="KOA" />
  <h1>KOA</h1>
  <form id="zoa-form" action="https://www.google.com/search" method="GET">
    <div class="aiwrap" id="aiwrap">
      <div class="bar-row">
        <input id="zoa-input" name="q" placeholder="Chiedi a ZEN o cerca…" autocomplete="off" autofocus />
        <button id="zenmode" type="button" title="Chiedi a ZEN 7.5 MAX">ZEN mode</button>
      </div>
      <div id="zen-answer">
        <div class="who">ZEN 7.5 MAX</div>
        <div id="zen-text"></div>
        <div id="zen-err"></div>
        <div class="zen-actions" id="zen-actions" hidden>
          <button id="zen-continue" type="button">Continua conversazione</button>
          <button id="zen-google" type="button">Cerca su Google</button>
        </div>
      </div>
    </div>
  </form>
  <div class="tiles">
    <a href="https://www.google.com">Google</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://www.wikipedia.org">Wikipedia</a>
  </div>
<script>
(function () {
  var w = document.getElementById('aiwrap');
  var inp = document.getElementById('zoa-input');
  var form = document.getElementById('zoa-form');
  var zm = document.getElementById('zenmode');
  var box = document.getElementById('zen-answer');
  var txt = document.getElementById('zen-text');
  var err = document.getElementById('zen-err');
  var acts = document.getElementById('zen-actions');
  if (!w || !inp) return;
  // --- Glow che segue il mouse (come AI Mode) ---
  var R = 320, tx = 0.5, ty = 0.5, x = 0.5, y = 0.5;
  var tglow = 0, glow = 0, focused = false, idle = 99;
  function track(e) {
    var r = w.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    var d = Math.sqrt(dx * dx + dy * dy);
    var p = Math.max(0, 1 - d / R);
    tglow = p * p;
    tx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    ty = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    idle = 0;
  }
  document.addEventListener('mousemove', track, { passive: true });
  document.addEventListener('mouseleave', function () { tglow = 0; });
  inp.addEventListener('focus', function () { focused = true; });
  inp.addEventListener('blur', function () { focused = false; });
  (function loop() {
    idle += 0.016;
    x += (tx - x) * 0.18;
    y += (ty - y) * 0.18;
    glow += (tglow - glow) * 0.15;
    var ix = x, iy = y;
    if (idle > 3 && !focused) {
      var t = performance.now() / 1000;
      ix = 0.5 + 0.32 * Math.sin(t * 0.5);
      iy = 0.5 + 0.2 * Math.cos(t * 0.34);
    }
    var g = focused ? Math.max(glow, 0.9) : glow;
    w.style.setProperty('--mx', (ix * 100).toFixed(2) + '%');
    w.style.setProperty('--my', (iy * 100).toFixed(2) + '%');
    w.style.setProperty('--glow', Math.max(0, Math.min(1, g)).toFixed(3));
    requestAnimationFrame(loop);
  })();
  // --- ZEN mode: chiede a ZEN 7.5 MAX, la barra si allunga con la risposta ---
  var busy = false, lastQ = '', lastA = '';
  function hist() {
    try { return JSON.parse(localStorage.getItem('koa.zenchat-hist') || '[]'); } catch (e) { return []; }
  }
  function saveHist(h) {
    try { localStorage.setItem('koa.zenchat-hist', JSON.stringify(h.slice(-30))); } catch (e) {}
  }
  async function askZen(q) {
    const body = { messages: [{ role: 'user', content: q.slice(0, 1500) }], model: 'openai' };
    try {
      const r = await fetch('https://text.pollinations.ai/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (r.ok) { const t = await r.text(); if (t.trim()) return t.trim(); }
    } catch (e) {}
    const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(q.slice(0, 400)));
    const t2 = await r2.text();
    if (!t2.trim()) throw new Error('vuoto');
    return t2.trim();
  }
  var typeTimer = 0;
  function typewrite(text, done) {
    clearInterval(typeTimer);
    txt.innerHTML = '';
    var span = document.createElement('span');
    span.className = 'caret';
    txt.appendChild(span);
    var i = 0;
    typeTimer = setInterval(function () {
      i += 3;
      span.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); span.classList.remove('caret'); if (done) done(); }
    }, 14);
  }
  zm.addEventListener('click', async function () {
    if (busy) return;
    const q = inp.value.trim();
    if (!q) { inp.focus(); return; }
    busy = true;
    zm.disabled = true;
    err.textContent = '';
    acts.hidden = true;
    document.getElementById('zen-continue').disabled = false;
    box.classList.add('open');
    w.classList.add('zen-on');
    txt.innerHTML = '';
    var wait = document.createElement('div');
    wait.textContent = 'ZEN 7.5 MAX sta pensando…';
    wait.style.cssText = 'font-size:12px;letter-spacing:.1em;color:#E8A83C;';
    txt.appendChild(wait);
    try {
      const a = await askZen(q);
      lastQ = q; lastA = a;
      typewrite(a, function () { acts.hidden = false; });
    } catch (e) {
      err.textContent = 'ZEN non risponde: controlla la rete o cerca su Google.';
      acts.hidden = false;
      document.getElementById('zen-continue').disabled = true;
      lastQ = q; lastA = '';
    }
    busy = false;
    zm.disabled = false;
  });
  document.getElementById('zen-continue').addEventListener('click', function () {
    if (!lastQ) return;
    const h = hist();
    h.push({ who: 'user', text: lastQ });
    if (lastA) h.push({ who: 'ai', text: lastA });
    saveHist(h);
    window.open('zenchat.html', '_blank');
  });
  document.getElementById('zen-google').addEventListener('click', function () {
    form.submit();
  });
})();
</script>
</body>
</html>
