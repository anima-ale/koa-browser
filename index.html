<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>KOA Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* KOA Browser — legno scuro e arancione vermiglio */
    --bg-0:       #1C130D;
    --bg:         #2A1C12;
    --panel:      rgba(62, 42, 26, 0.78);
    --panel-solid:#3E2A1A;
    --panel-2:    rgba(96, 63, 36, 0.55);
    --line:       #6B4A2E;
    --line-soft:  rgba(107, 74, 46, 0.55);
    --text:       #F5EDE0;
    --text-muted: #B9A58C;
    --accent:     #E86A2C;
    --highlight:  #E8A83C;
    --orange:     #E86A2C;
    --amber:      #E8A83C;
    --violet:     #D9B36A;
    --orange-dim: rgba(232, 106, 44, 0.16);
    --glow:       0 0 18px rgba(232, 106, 44, 0.35);
    --glow-soft:  0 0 10px rgba(232, 106, 44, 0.22);
    --grad:       linear-gradient(100deg, #E86A2C, #E8A83C);
    --glass:      blur(20px) saturate(1.25);
    --radius:     8px;
    --font: 'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: var(--font);
    font-size: 14px;
    background: var(--bg-0);
    color: var(--text);
  }
  ::selection { background: rgba(232, 168, 60, 0.38); color: #2A1C12; }
  /* Mesh di luce calda dietro il vetro */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(620px 300px at 10% -6%, rgba(232, 106, 44, 0.15), transparent 60%),
      radial-gradient(720px 340px at 90% -2%, rgba(232, 168, 60, 0.10), transparent 60%),
      radial-gradient(900px 480px at 50% 116%, rgba(217, 179, 106, 0.08), transparent 60%),
      var(--bg-0);
  }
  #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; z-index: 1; }

  /* ---------- KOA · Tab strip ---------- */
  #tabs {
    display: flex;
    align-items: stretch;
    background: rgba(8, 8, 12, 0.62);
    -webkit-backdrop-filter: var(--glass);
    backdrop-filter: var(--glass);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(232, 106, 44, 0.07);
    overflow-x: auto;
    scrollbar-width: none;
    position: relative;
    z-index: 30;
  }
  #tabs::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 150px;
    max-width: 230px;
    padding: 11px 14px;
    background: transparent;
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    cursor: grab;
    position: relative;
    border-right: 1px solid var(--line-soft);
    transition: color 140ms var(--ease), background 140ms var(--ease), opacity 140ms var(--ease);
    animation: tab-in 180ms var(--ease);
  }
  /* Indicatore di luce: barra gradiente che scorre da sinistra */
  .tab::before {
    content: "";
    position: absolute;
    top: 0; left: 12px; right: 12px;
    height: 2px;
    background: var(--grad);
    box-shadow: var(--glow);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 200ms var(--ease);
  }
  @keyframes tab-in {
    from { opacity: 0; transform: translateY(-7px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tab:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.03);
  }
  .tab:hover::before { transform: scaleX(0.45); }
  .tab.active {
    background: linear-gradient(180deg, rgba(232, 106, 44, 0.13), rgba(255, 255, 255, 0.02));
    color: var(--text);
    text-shadow: 0 0 12px rgba(232, 106, 44, 0.25);
  }
  .tab.active::before { transform: scaleX(1); }
  .tab.in-split {
    color: var(--text);
  }
  .tab.dragging { opacity: 0.35; cursor: grabbing; }

  /* Gruppo split: le due schede unite con una sola X */
  .tab.group-tab {
    display: none;
    min-width: 210px;
    max-width: 330px;
    background: linear-gradient(180deg, rgba(232, 106, 44, 0.16), rgba(217, 179, 106, 0.07));
    color: var(--text);
    cursor: pointer;
    border-left: 1px solid rgba(232, 106, 44, 0.4);
    border-right: 1px solid rgba(232, 106, 44, 0.4);
    box-shadow: inset 0 0 22px rgba(232, 106, 44, 0.07);
  }
  .tab.group-tab.visible { display: flex; }
  .tab.group-tab::before { transform: scaleX(1); }
  .tab-group-icon {
    display: flex; align-items: center; justify-content: center;
    color: var(--orange);
    filter: drop-shadow(0 0 6px rgba(232, 106, 44, 0.6));
    flex-shrink: 0;
  }
  .tab-group-icon svg { width: 12px; height: 12px; }
  .tab-group-sep { color: var(--orange); font-weight: 700; flex-shrink: 0; }

  .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tab-close {
    display: flex; align-items: center; justify-content: center;
    width: 16px; height: 16px;
    opacity: 0;
    color: var(--text-muted);
    transition: opacity 120ms var(--ease), color 120ms var(--ease), filter 120ms var(--ease);
    flex-shrink: 0;
  }
  .tab:hover .tab-close, .tab.group-tab.visible .tab-close { opacity: 0.7; }
  .tab-close:hover { opacity: 1 !important; color: var(--orange); filter: drop-shadow(0 0 6px rgba(232, 106, 44, 0.8)); }
  .tab-close svg { width: 10px; height: 10px; }

  #new-tab-btn {
    display: flex; align-items: center; justify-content: center;
    width: 40px;
    color: var(--text-muted);
    cursor: pointer;
    border-right: 1px solid var(--line-soft);
    transition: color 120ms var(--ease), background 120ms var(--ease), text-shadow 120ms var(--ease);
    flex-shrink: 0;
  }
  #new-tab-btn:hover { color: var(--orange); background: rgba(232, 106, 44, 0.09); text-shadow: var(--glow); }
  #new-tab-btn svg { width: 16px; height: 16px; }

  /* ---------- KOA · Toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: stretch;
    background: rgba(12, 12, 17, 0.78);
    -webkit-backdrop-filter: var(--glass);
    backdrop-filter: var(--glass);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    position: relative;
    z-index: 40;
  }

  .nav-btn {
    display: flex; align-items: center; justify-content: center;
    width: 42px;
    color: var(--text);
    cursor: pointer;
    border-right: 1px solid var(--line-soft);
    transition: color 120ms var(--ease), background 120ms var(--ease), transform 100ms var(--ease), text-shadow 120ms var(--ease);
    position: relative;
  }
  .nav-btn::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px; bottom: 5px;
    height: 2px;
    background: var(--grad);
    box-shadow: var(--glow-soft);
    transform: scaleX(0);
    transition: transform 160ms var(--ease);
  }
  .nav-btn:hover { color: var(--orange); background: rgba(232, 106, 44, 0.07); text-shadow: var(--glow-soft); }
  .nav-btn:hover::after { transform: scaleX(1); }
  .nav-btn:active { transform: scale(0.9); }
  .nav-btn.disabled { opacity: 0.28; pointer-events: none; }
  .nav-btn svg { width: 16px; height: 16px; }

  .compass.spinning { animation: compass-spin 800ms linear infinite; }
  @keyframes compass-spin { to { transform: rotate(360deg); } }

  #url-form { flex: 1; display: flex; }
  /* Tubo con fluido: strisce in scorrimento + bolle alla deriva */
  #url-bar-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 9px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 18px;
    margin: 7px 10px;
    height: 34px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), inset 0 -4px 8px rgba(0, 0, 0, 0.55);
    transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease), background 160ms var(--ease);
  }
  #url-bar-wrap::before {
    content: "";
    position: absolute; inset: 0;
    z-index: 0;
    background: repeating-linear-gradient(115deg,
      transparent 0 14px,
      rgba(232, 106, 44, 0.13) 14px 26px,
      rgba(232, 168, 60, 0.10) 26px 30px,
      transparent 30px 44px);
    opacity: 0.65;
    animation: tube-flow 3.2s linear infinite;
    transition: opacity 160ms var(--ease);
  }
  #url-bar-wrap::after {
    content: "";
    position: absolute; top: 50%; left: -6%;
    z-index: 0;
    width: 9px; height: 9px; margin-top: -4px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(245, 237, 224, 0.9), rgba(232, 106, 44, 0.25));
    box-shadow:
      46px -5px 0 -3px rgba(232, 168, 60, 0.55),
      92px 5px 0 -2px rgba(217, 179, 106, 0.5),
      150px -3px 0 -4px rgba(245, 237, 224, 0.5),
      218px 4px 0 -2px rgba(232, 106, 44, 0.5);
    opacity: 0;
    animation: tube-bubbles 7s linear infinite;
  }
  @keyframes tube-flow { to { background-position-x: 88px; } }
  @keyframes tube-bubbles {
    0%   { left: -6%; opacity: 0; }
    8%   { opacity: 0.9; }
    88%  { opacity: 0.9; }
    100% { left: 104%; opacity: 0; }
  }
  #url-bar-wrap:focus-within {
    border-color: rgba(232, 106, 44, 0.75);
    background: rgba(0, 0, 0, 0.6);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -4px 8px rgba(0, 0, 0, 0.55),
      0 0 0 3px var(--orange-dim), 0 0 26px rgba(232, 106, 44, 0.28);
  }
  #url-bar-wrap:focus-within::before { opacity: 1; }
  /* In caricamento il fluido accelera */
  #url-bar-wrap.loading::before { animation-duration: 0.9s; opacity: 1; }
  #url-bar-wrap.loading::after { animation-duration: 2.4s; }
  #url-bar-wrap.loading { border-color: rgba(232, 168, 60, 0.7); }
  #url-bar-wrap svg { flex-shrink: 0; opacity: 0.55; width: 12px; height: 12px; transition: opacity 140ms var(--ease); position: relative; z-index: 1; }
  #url-bar-wrap:focus-within svg { opacity: 1; color: var(--orange); filter: drop-shadow(0 0 5px rgba(232, 106, 44, 0.8)); }
  #url-bar {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    letter-spacing: 0.01em;
    caret-color: var(--orange);
    outline: none;
    position: relative; z-index: 1;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  #url-bar::placeholder { color: var(--text-muted); text-shadow: none; }
  @media (prefers-reduced-motion: reduce) {
    #url-bar-wrap::before, #url-bar-wrap::after { animation: none; }
    #url-bar-wrap::after { display: none; }
  }

  /* ---------- KOA · View area / split screen ---------- */
  #main-row { flex: 1; min-height: 0; overflow: hidden; position: relative; }

  #view-container {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    width: 100%;
    height: 100%;
    min-width: 0;
    background: #08080c;
    transition: border-color 140ms var(--ease);
  }
  #view-container.drop-left  { box-shadow: inset 6px 0 0 var(--orange), inset 6px 0 24px rgba(232, 106, 44, 0.45); }
  #view-container.drop-right { box-shadow: inset -6px 0 0 var(--orange), inset -6px 0 24px rgba(232, 106, 44, 0.45); }

  .view-slot {
    display: none;
    flex-direction: column;
    height: 100%;
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    overflow: hidden;
    grid-row: 1;
  }

  /* Pannello a fuoco in split: contorno di luce */
  .view-slot.split.focused { outline: 1px solid rgba(232, 106, 44, 0.65); outline-offset: -1px; }

  .view-slot webview { width: 100%; height: 100%; flex: 1; min-width: 0; min-height: 0; }

  .split-divider {
    display: none;
    height: 100%;
    min-height: 0;
    width: 4px;
    grid-row: 1;
    background: linear-gradient(180deg, rgba(232, 106, 44, 0.55), rgba(232, 168, 60, 0.35), rgba(217, 179, 106, 0.4));
    cursor: col-resize;
    transition: box-shadow 140ms var(--ease), filter 140ms var(--ease);
  }
  .split-divider:hover, .split-divider.dragging {
    background: var(--grad);
    box-shadow: var(--glow);
    filter: brightness(1.15);
  }
  .split-divider.h {
    width: 100%;
    height: 100%;
    cursor: row-resize;
    background: linear-gradient(90deg, rgba(232, 106, 44, 0.55), rgba(232, 168, 60, 0.35), rgba(217, 179, 106, 0.4));
  }
  .split-divider.h:hover, .split-divider.h.dragging { background: var(--grad); }

  /* ---------- Split animations ---------- */
  @keyframes pane-in-left {
    from { transform: translateX(-36px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes pane-in-right {
    from { transform: translateX(36px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes divider-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .view-slot.anim-in-left { animation: pane-in-left 280ms var(--ease); }
  .view-slot.anim-in-right { animation: pane-in-right 280ms var(--ease); }
  .split-divider.anim-in { animation: divider-in 280ms var(--ease); }
  @media (prefers-reduced-motion: reduce) {
    .view-slot.anim-in-left, .view-slot.anim-in-right, .split-divider.anim-in, .drop-col.hover { animation: none; }
  }

  /* ---------- KOA · Drop overlay per drag tab -> split ---------- */
  #drop-overlay {
    position: absolute;
    inset: 0;
    z-index: 60;
    display: none;
    gap: 10px;
    padding: 14px;
    background: rgba(5, 5, 8, 0.45);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #drop-overlay.active { display: flex; }
  .drop-col {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.015);
    transition: background 140ms var(--ease), border-color 140ms var(--ease), box-shadow 140ms var(--ease);
  }
  .drop-col.hover {
    background: rgba(232, 106, 44, 0.10);
    border-color: var(--orange);
    border-style: solid;
    box-shadow: inset 0 0 44px rgba(232, 106, 44, 0.14), var(--glow-soft);
    animation: drop-pulse 1.1s ease-in-out infinite;
  }
  @keyframes drop-pulse {
    0%, 100% { box-shadow: inset 0 0 34px rgba(232, 106, 44, 0.10), 0 0 10px rgba(232, 106, 44, 0.12); }
    50%      { box-shadow: inset 0 0 54px rgba(232, 106, 44, 0.20), 0 0 26px rgba(232, 106, 44, 0.30); }
  }
  .drop-col span {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    border: 1px solid var(--line);
    background: rgba(10, 10, 15, 0.9);
    padding: 10px 16px;
    pointer-events: none;
    transition: color 140ms var(--ease), border-color 140ms var(--ease), box-shadow 140ms var(--ease);
  }
  .drop-col.hover span { color: var(--orange); border-color: var(--orange); box-shadow: var(--glow-soft); }

  /* ---------- KOA Browser · radius ---------- */
  .tab { border-radius: var(--radius) var(--radius) 0 0; }
  .tab.group-tab { border-radius: var(--radius) var(--radius) 0 0; }
  #url-bar-wrap { border-radius: 999px; }
  .nav-btn { border-radius: 6px; }
  .drop-col { border-radius: var(--radius); }
  .drop-col span { border-radius: 6px; }
  #talk-btn { border-radius: 0; }

  /* ---------- KOA Browser · layout ---------- */
  #brand {
    display: flex; align-items: center; gap: 9px;
    padding: 0 14px 0 10px;
    border-right: 1px solid var(--line-soft);
    flex-shrink: 0;
    user-select: none;
  }
  #brand img { width: 22px; height: 22px; display: block; }
  #brand span {
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #talk-btn { width: auto; padding: 0 14px; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.03em; }
  #talk-btn .talk-label { white-space: nowrap; }
  #talk-btn::after { left: 12px; right: 12px; }

  #content { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px; }
  #main-row { flex: 1; min-width: 0; }
  #view-container { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }

  /* ---------- KOA Browser · sidebar ---------- */
  #sidebar {
    width: 280px; flex-shrink: 0;
    min-height: 0;
    display: flex;
  }
  #app.side-collapsed #sidebar { display: none; }
  .side-scroll {
    flex: 1; min-height: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding-bottom: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .card {
    background: var(--panel);
    -webkit-backdrop-filter: var(--glass);
    backdrop-filter: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .card > header {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--text);
  }
  .card-dot { width: 7px; height: 7px; background: var(--grad); box-shadow: var(--glow-soft); flex-shrink: 0; border-radius: 50%; }
  .card input[type="text"], .card textarea {
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease);
  }
  .card input[type="text"]:focus, .card textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--orange-dim);
  }
  .card .row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px; font-weight: 600;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color 120ms var(--ease), color 120ms var(--ease), background 120ms var(--ease);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(232, 106, 44, 0.08); }
  .btn.danger:hover { border-color: #bf616a; color: #bf616a; background: rgba(191, 97, 106, 0.08); }

  /* Supervisor */
  #sup-state { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-muted); }
  #sup-state.on { color: var(--highlight); text-shadow: 0 0 8px rgba(232, 168, 60, 0.6); }
  .sup-count { display: flex; align-items: baseline; gap: 8px; }
  .sup-count span { font-size: 30px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .sup-count small { font-size: 11px; color: var(--text-muted); letter-spacing: 0.04em; }
  #sup-last {
    font-size: 11.5px; color: var(--text-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 6px 9px;
  }
  .sup-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; font-weight: 600; }
  .sup-note { font-size: 10.5px; color: var(--text-muted); letter-spacing: 0.03em; }
  .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--line);
    border-radius: 20px;
    transition: background 140ms var(--ease), border-color 140ms var(--ease);
    cursor: pointer;
  }
  .switch i::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px;
    background: var(--text-muted);
    border-radius: 50%;
    transition: transform 140ms var(--ease), background 140ms var(--ease);
  }
  .switch input:checked + i { background: rgba(232, 168, 60, 0.25); border-color: var(--highlight); }
  .switch input:checked + i::after { transform: translateX(17px); background: var(--highlight); box-shadow: 0 0 8px rgba(232, 168, 60, 0.6); }

  /* Chat */
  #chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; scrollbar-width: thin; }
  .msg { display: flex; gap: 8px; align-items: flex-start; animation: tab-in 160ms var(--ease); }
  .msg .avatar {
    width: 22px; height: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700;
    background: var(--grad); color: #2A1C12; border-radius: 50%;

  }
  .msg.user .bubble { background: rgba(232, 106, 44, 0.14); border-color: rgba(232, 106, 44, 0.45); }
  .msg.koa .bubble { background: rgba(232, 168, 60, 0.08); border-color: rgba(232, 168, 60, 0.3); }
  .bubble button.linklike {

  .bubble button.linklike:hover { background: rgba(232, 106, 44, 0.12); }
  #chat-form { display: flex; gap: 8px; }
  #chat-form input { flex: 1; min-width: 0; }
  #chat-form button {
    width: 34px; flex-shrink: 0;

  #chat-form button:hover { filter: brightness(1.12); }

  .card > header .mini-btn {
    margin-left: auto;
    background: rgba(232, 106, 44, 0.1);
    border: 1px solid rgba(232, 106, 44, 0.45);
    border-radius: 6px;
    color: var(--accent);
    font-family: var(--font);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;

  }
  .card > header .mini-btn:hover { background: rgba(232, 106, 44, 0.2); box-shadow: var(--glow-soft); }
  /* ---------- KOA · impostazioni + ZENdate ---------- */
  #settings-modal {
    position: fixed; inset: 0; z-index: 500;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;

    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #settings-modal[hidden] { display: none; }
  .settings-card {
    width: 560px; max-width: 94vw;
    max-height: 92vh; overflow-y: auto;

    padding: 40px 44px;

  .settings-card img { width: 76px; height: 76px; filter: drop-shadow(0 0 18px rgba(232, 106, 44, 0.35)); }
  .settings-card h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.14em; }
  .settings-sub {
    margin-top: -8px;

  #settings-version {
    font-size: clamp(64px, 16vw, 96px); font-weight: 700; line-height: 1.05;
    white-space: nowrap; overflow: visible;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(232, 106, 44, 0.25));
    font-variant-numeric: tabular-nums;
    padding: 0 8px;
  }
  #update-status {
    font-size: 13px; font-weight: 500; letter-spacing: 0.02em;

  #update-progress {

  }

  .settings-card .row { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
  .settings-card .row .btn { padding: 11px 10px; font-size: 13px; }
  .btn.primary { background: var(--grad); border: none; color: #2A1C12; }
  .btn.primary:hover { color: #2A1C12; border-color: transparent; filter: brightness(1.12); background: var(--grad); }
  .btn:disabled { opacity: 0.45; cursor: default; }
</style>
</head>
<body>
<div id="app" class="side-collapsed">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

  <div id="content">

          <header><span class="card-dot"></span>CHAT KOA<button id="chat-summarize" class="mini-btn" title="Riassumi la pagina aperta">Riassumi</button></header>
          <div id="chat-msgs"></div>

            <input id="chat-input" type="text" placeholder="/calc 2+2 · /cerca gatti · /aiuto" autocomplete="off" spellcheck="false" />

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 12l16-7-7 16-2-7z"/></svg>

  <div id="settings-modal" hidden>
    <div class="settings-card">
      <img src="assets/logo.svg" alt="KOA" />
      <h1>KOA Browser</h1>
      <div class="settings-sub">ZENdate MAX · aggiornamento automatico</div>
      <div id="settings-version">…</div>
      <div id="update-status">Mai verificato in questa sessione.</div>
      <div id="update-progress"><i></i></div>
      <div id="update-notes"></div>
      <div class="row">
        <button id="zendate-check" class="btn primary">Controlla ZENdate</button>
        <button id="settings-close" class="btn">Chiudi</button>
      </div>

<script>
  const tabsEl = document.getElementById('tabs');
  const newTabBtn = document.getElementById('new-tab-btn');
  const viewContainer = document.getElementById('view-container');
  const urlForm = document.getElementById('url-form');
  const urlBar = document.getElementById('url-bar');
  const urlBarWrap = document.getElementById('url-bar-wrap');
  const backBtn = document.getElementById('back-btn');
  const forwardBtn = document.getElementById('forward-btn');
  const reloadBtn = document.getElementById('reload-btn');
  const compassIcon = document.getElementById('compass-icon');
  const protocolIcon = document.getElementById('protocol-icon');
  const talkBtn = document.getElementById('talk-btn');
  const dropOverlay = document.getElementById('drop-overlay');
  const dropCols = [...document.querySelectorAll('.drop-col')];

  const HOME_URL = 'https://www.google.com';
  let tabs = [];              // { id, tabEl, paneEl, webview, title }
  let activeTabId = null;     // tab shown full-screen when not split
  let draggedTabId = null;
  let splitState = null;      // { panes: [id…] (2-4), rows: [%…], cols: [%…], focus: id } — rettangolare, persiste finché non viene tolto
  let showingSplit = false;   // true = vista split visibile; false = vista singola (lo split resta in background)
  let splitEnterSide = null;  // 'left'|'right' = lato entrante, consumato da applyLayout per l'animazione
  let ratioAnimId = 0;        // rAF dell'animazione di apertura split
  let tabCounter = 0;

  // ---- scheda unita dello split (una sola X che chiude tutto) ----
  const groupTabEl = document.createElement('div');
  groupTabEl.className = 'tab group-tab';
  groupTabEl.title = 'Split — clicca per vedere le due schede insieme';
  groupTabEl.innerHTML = `
    <span class="tab-group-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="8" height="16"/><rect x="13" y="4" width="8" height="16"/></svg>
    </span>
    <span class="tab-title">Split</span>
    <span class="tab-close" title="Chiudi lo split (entrambe le schede)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </span>`;
  groupTabEl.addEventListener('click', (e) => {
    if (e.target.closest('.tab-close')) { closeSplitGroup(); return; }
    showingSplit = true;
    applyLayout();
  });

  function isInSplit(id) {
    return !!splitState && splitState.panes.includes(id);
  }

  function getTab(id) {
    return tabs.find(t => t.id === id);
  }

  function shortTitle(s, max = 22) {
    s = (s || 'Nuova scheda').trim();
    return s.length > max ? s.slice(0, max - 1) + '…' : s;
  }

  // Aggiorna la scheda unita: visibile solo se esiste uno split,
  // al posto della prima scheda, con i titoli delle pagine e una sola X.
  function updateGroupTab() {
    if (!splitState) {
      groupTabEl.classList.remove('visible', 'active');
      if (groupTabEl.parentNode) groupTabEl.remove();
      tabs.forEach(t => { t.tabEl.style.display = ''; });
      return;
    }
    const members = splitState.panes.map(getTab);
    if (members.some(m => !m)) return;
    const max = members.length > 2 ? 12 : 22;
    groupTabEl.querySelector('.tab-title').textContent =
      members.map(m => shortTitle(m.title, max)).join(' + ');
    groupTabEl.classList.add('visible');
    groupTabEl.classList.toggle('active', showingSplit);
    // La scheda unita prende il posto della prima…
    tabsEl.insertBefore(groupTabEl, members[0].tabEl);
    // …e le schede singole spariscono (resta solo la X del gruppo).
    members.forEach(m => { m.tabEl.style.display = 'none'; });
    tabs.forEach(t => {
      if (!isInSplit(t.id)) t.tabEl.style.display = '';
    });
  }

  function normalizeUrl(input) {
    const trimmed = input.trim();
    const looksLikeUrl = /^https?:\/\//i.test(trimmed) || /^[\w-]+(\.[\w-]+)+.*$/.test(trimmed);
    if (!trimmed) return HOME_URL;
    if (/^https?:\/\//i.test(trimmed)) return trimmed;
    if (looksLikeUrl) return 'https://' + trimmed;
    return 'https://www.google.com/search?q=' + encodeURIComponent(trimmed);
  }

  function isFocused(id) {
    if (splitState && showingSplit) {
      return id === splitState.focus;
    }
    return id === activeTabId;
  }

  function getFocusedTab() {
    return tabs.find(t => isFocused(t.id));
  }

  function createTab(url = HOME_URL) {
    const id = ++tabCounter;

    // ---- tab strip entry ----
    const tabEl = document.createElement('div');
    tabEl.className = 'tab';
    tabEl.draggable = true;
    tabEl.dataset.tabId = String(id);
    tabEl.innerHTML = `
      <span class="tab-title">Nuova scheda</span>
      <span class="tab-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </span>`;
    tabEl.addEventListener('click', (e) => {
      if (e.target.closest('.tab-close')) { closeTab(id); return; }
      // Lo split non si rompe mai da solo: se la scheda è nello split
      // lo mostra e la mette a fuoco, altrimenti mostra lei singola
      // (lo split resta legato in background).
      if (isInSplit(id)) {
        showingSplit = true;
        splitState.focus = id;
      } else {
        showingSplit = false;
        activeTabId = id;
      }
      applyLayout();
    });
    tabEl.addEventListener('dragstart', (e) => {
      draggedTabId = id;
      tabEl.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(id));
      showDropOverlay();
    });
    tabEl.addEventListener('dragend', () => {
      tabEl.classList.remove('dragging');
      draggedTabId = null;
      hideDropOverlay();
      syncTabOrder();
    });
    tabsEl.insertBefore(tabEl, newTabBtn);

    // ---- view pane (persistent wrapper, never re-parented) ----
    const paneEl = document.createElement('div');
    paneEl.className = 'view-slot';

    const webview = document.createElement('webview');
    webview.setAttribute('src', url);
    webview.setAttribute('allowpopups', '');
    paneEl.appendChild(webview);
    viewContainer.appendChild(paneEl);

    webview.addEventListener('page-title-updated', (e) => {
      tab.title = e.title;
      tabEl.querySelector('.tab-title').textContent = e.title;
      updateGroupTab();
    });
    webview.addEventListener('did-start-loading', () => {
      if (isFocused(id)) setLoading(true);
    });
    webview.addEventListener('did-stop-loading', () => {
      if (isFocused(id)) setLoading(false);
      updateNavButtons();
    });
    webview.addEventListener('did-navigate', (e) => {
      if (isFocused(id)) { urlBar.value = e.url; setProtocol(e.url); }
      updateNavButtons();
    });
    webview.addEventListener('did-navigate-in-page', (e) => {
      if (isFocused(id)) { urlBar.value = e.url; setProtocol(e.url); }
      updateNavButtons();
    });
    // Scrollbar liquida su ogni pagina (anche SPA / navigazioni interne)
    webview.addEventListener('did-finish-load', () => injectKoaScrollbar(webview));
    webview.addEventListener('did-navigate-in-page', () => injectKoaScrollbar(webview));

    const tab = { id, tabEl, paneEl, webview, title: 'Nuova scheda' };
    tabs.push(tab);
    // Una nuova scheda si mostra singola, ma lo split resta legato in background.
    showingSplit = false;
    activeTabId = id;
    applyLayout();
    return id;
  }

  // Chiude una singola scheda. Se era nello split, il pannello esce
  // (le proporzioni restano) e con un solo superstite lo split si scioglie.
  function closeTab(id) {
    const idx = tabs.findIndex(t => t.id === id);
    if (idx === -1) return;
    const [tab] = tabs.splice(idx, 1);
    tab.tabEl.remove();
    tab.paneEl.remove();

    if (splitState && splitState.panes.includes(id)) {
      splitState.panes = splitState.panes.filter(p => p !== id);
      if (splitState.panes.length <= 1) {
        const lastId = splitState.panes[0];
        splitState = null;
        showingSplit = false;
        activeTabId = (lastId != null && getTab(lastId)) ? lastId : ((tabs[idx] || tabs[idx - 1] || {}).id ?? null);
      } else if (splitState.focus === id) {
        splitState.focus = splitState.panes[0];
      }
    } else if (activeTabId === id) {
      const next = tabs[idx] || tabs[idx - 1];
      activeTabId = next ? next.id : null;
    }

    if (tabs.length === 0) { createTab(); return; }
    if (activeTabId != null && !getTab(activeTabId)) {
      activeTabId = tabs[tabs.length - 1].id;
    }
    // Se resta solo lo split legato, lo si rimostra invece di una scheda nascosta.
    if (splitState && activeTabId != null && isInSplit(activeTabId)) {
      showingSplit = true;
    }
    applyLayout();
  }

  // La X della scheda unita: chiude TUTTO lo split (tutti i pannelli).
  function closeSplitGroup() {
    if (!splitState) return;
    const ids = splitState.panes.slice();
    splitState = null;
    showingSplit = false;
    ids.forEach(id => {
      const idx = tabs.findIndex(t => t.id === id);
      if (idx !== -1) {
        const [tab] = tabs.splice(idx, 1);
        tab.tabEl.remove();
        tab.paneEl.remove();
      }
    });
    if (groupTabEl.parentNode) groupTabEl.remove();
    groupTabEl.classList.remove('visible', 'active');
    if (tabs.length === 0) { createTab(); return; }
    activeTabId = tabs[tabs.length - 1].id;
    applyLayout();
  }

  // ---- griglia rettangolare + divider dinamici ----
  // n=2: 2 colonne. n=3: 1 sopra + 2 sotto. n=4: griglia 2x2.
  let dividerEls = [];
  let builtForSplitN = 0;
  let resizing = null; // { type: 'v'|'h', gap }
  let resizeStartX = 0;
  let resizeStartY = 0;
  let resizeStartSizes = [];
  let resizeWidth = 1;

  function trackList(arr) {
    // fr + minmax(0, …): la somma resta sempre 100% senza i px in più,
    // e il webview non può forzare le tracce oltre la misura.
    return arr.map(s => `minmax(0, ${s}fr)`).join(' 4px ');
  }

  function applySplitGrid() {
    viewContainer.style.gridTemplateRows = trackList(splitState.rows);
    viewContainer.style.gridTemplateColumns = trackList(splitState.cols);
  }

  function normSplitSizes() {
    const n = splitState.panes.length;
    if (!Array.isArray(splitState.cols) || splitState.cols.length !== 2) splitState.cols = [50, 50];
    if (n >= 3 && (!Array.isArray(splitState.rows) || splitState.rows.length !== 2)) splitState.rows = [55, 45];
    if (n < 3) splitState.rows = [100];
  }

  function makeDivider(horizontal, gap) {
    const d = document.createElement('div');
    d.className = 'split-divider' + (horizontal ? ' h' : '');
    d.dataset.h = horizontal ? '1' : '0';
    d.dataset.gap = String(gap);
    d.addEventListener('mousedown', (e) => {
      if (!splitState || !showingSplit) return;
      e.preventDefault();
      cancelAnimationFrame(ratioAnimId);
      const isH = d.dataset.h === '1';
      resizing = { type: isH ? 'h' : 'v', gap: Number(d.dataset.gap || 0) };
      resizeStartX = e.clientX;
      resizeStartY = e.clientY;
      resizeStartSizes = (isH ? splitState.rows : splitState.cols).slice();
      const rect = viewContainer.getBoundingClientRect();
      resizeWidth = (isH ? rect.height : rect.width) || 1;
      d.classList.add('dragging');
    });
    viewContainer.appendChild(d);
    return d;
  }

  // Ricostruisce i divider solo quando cambia il numero di pannelli.
  function buildDividers(n) {
    if (builtForSplitN === n && dividerEls.length) {
      dividerEls.forEach(d => { d.style.display = 'block'; });
      return;
    }
    dividerEls.forEach(d => d.remove());
    dividerEls = [];
    if (n === 2) {
      const v = makeDivider(false, 0);
      v.style.gridRow = '1'; v.style.gridColumn = '2';
      dividerEls = [v];
    } else if (n === 3) {
      const h = makeDivider(true, 0);
      h.style.gridRow = '2'; h.style.gridColumn = '1 / span 3';
      const v = makeDivider(false, 0);
      v.style.gridRow = '3'; v.style.gridColumn = '2';
      dividerEls = [h, v];
    } else if (n >= 4) {
      const h = makeDivider(true, 0);
      h.style.gridRow = '2'; h.style.gridColumn = '1 / span 3';
      const vt = makeDivider(false, 0);
      vt.style.gridRow = '1'; vt.style.gridColumn = '2';
      const vb = makeDivider(false, 0);
      vb.style.gridRow = '3'; vb.style.gridColumn = '2';
      dividerEls = [h, vt, vb];
    }
    dividerEls.forEach(d => { d.style.display = 'block'; });
    builtForSplitN = n;
  }

  // ---- layout: single o split rettangolare (2 / 3 / 4); resta legato finché non viene tolto ----
  function applyLayout() {
    const inSplitView = !!(splitState && showingSplit);
    if (!inSplitView) {
      viewContainer.style.gridTemplateRows = '1fr';
      viewContainer.style.gridTemplateColumns = '1fr';
      dividerEls.forEach(d => { d.style.display = 'none'; });
      tabs.forEach(t => {
        const shown = t.id === activeTabId;
        t.paneEl.style.display = shown ? 'flex' : 'none';
        t.paneEl.style.gridColumn = '1';
        t.paneEl.style.gridRow = '1';
        t.paneEl.classList.remove('split', 'focused');
        t.tabEl.classList.toggle('active', shown);
        t.tabEl.classList.remove('in-split');
      });
    } else {
      const n = splitState.panes.length;
      normSplitSizes();
      buildDividers(n);
      applySplitGrid();
      tabs.forEach(t => {
        const idx = splitState.panes.indexOf(t.id);
        if (idx === -1) {
          t.paneEl.style.display = 'none';
          t.paneEl.classList.remove('split');
        } else if (n === 2) {
          t.paneEl.style.display = 'flex';
          t.paneEl.style.gridRow = '1';
          t.paneEl.style.gridColumn = String(idx * 2 + 1);
          t.paneEl.classList.add('split');
          t.paneEl.classList.toggle('focused', isFocused(t.id));
        } else if (n === 3) {
          // idx 0 sopra a tutta larghezza, idx 1-2 sotto affiancati
          t.paneEl.style.display = 'flex';
          if (idx === 0) { t.paneEl.style.gridRow = '1'; t.paneEl.style.gridColumn = '1 / span 3'; }
          else { t.paneEl.style.gridRow = '3'; t.paneEl.style.gridColumn = String((idx - 1) * 2 + 1); }
          t.paneEl.classList.add('split');
          t.paneEl.classList.toggle('focused', isFocused(t.id));
        } else {
          // griglia 2x2: idx 0-1 sopra, idx 2-3 sotto
          t.paneEl.style.display = 'flex';
          t.paneEl.style.gridRow = idx < 2 ? '1' : '3';
          t.paneEl.style.gridColumn = String((idx % 2) * 2 + 1);
          t.paneEl.classList.add('split');
          t.paneEl.classList.toggle('focused', isFocused(t.id));
        }
        // Le schede dello split sono nascoste: le rappresenta il gruppo unito.
        t.tabEl.classList.remove('active', 'in-split');
        t.paneEl.classList.remove('anim-in-left', 'anim-in-right');
      });
      // Animazione d'ingresso: il pannello trascinato scivola dentro dal suo lato.
      if (splitEnterSide) {
        const entering = getTab(splitState.focus);
        if (entering) {
          const cls = splitEnterSide === 'left' ? 'anim-in-left' : 'anim-in-right';
          entering.paneEl.classList.add(cls);
          setTimeout(() => entering.paneEl.classList.remove('anim-in-left', 'anim-in-right'), 340);
        }
        dividerEls.forEach(d => d.classList.add('anim-in'));
        setTimeout(() => dividerEls.forEach(d => d.classList.remove('anim-in')), 340);
        splitEnterSide = null;
      }
    }
    updateGroupTab();
    if (splitState) {
      groupTabEl.classList.toggle('active', inSplitView || isInSplit(activeTabId));
    }
    refreshToolbarForFocusedTab();
  }

  function refreshToolbarForFocusedTab() {
    const tab = getFocusedTab();
    if (!tab) return;
    const wv = tab.webview;
    const url = wv.getURL ? (wv.getURL() || '') : '';
    urlBar.value = url;
    setProtocol(url);
    setLoading(wv.isLoading ? wv.isLoading() : false);
    updateNavButtons();
  }

  function updateNavButtons() {
    const tab = getFocusedTab();
    if (!tab) return;
    const wv = tab.webview;
    backBtn.classList.toggle('disabled', !wv.canGoBack());
    forwardBtn.classList.toggle('disabled', !wv.canGoForward());
  }

  function setLoading(isLoading) {
    compassIcon.classList.toggle('spinning', isLoading);
    urlBarWrap.classList.toggle('loading', isLoading);
  }

  function setProtocol(url) {
    protocolIcon.style.opacity = url.startsWith('https://') ? '1' : '0.4';
  }

  // ---- tab strip drag-to-reorder (la scheda-gruppo è esclusa: non si riordina) ----
  function getTabAfterElement(x) {
    const candidates = [...tabsEl.querySelectorAll('.tab[data-tab-id]:not(.dragging)')].filter(el => el.style.display !== 'none');
    return candidates.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = x - box.left - box.width / 2;
      if (offset < 0 && offset > closest.offset) return { offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
  }

  tabsEl.addEventListener('dragover', (e) => {
    if (draggedTabId == null) return;
    e.preventDefault();
    const draggingEl = tabsEl.querySelector('.tab.dragging');
    if (!draggingEl) return;
    const afterEl = getTabAfterElement(e.clientX);
    if (afterEl == null) tabsEl.insertBefore(draggingEl, newTabBtn);
    else tabsEl.insertBefore(draggingEl, afterEl);
  });

  function syncTabOrder() {
    const orderedIds = [...tabsEl.querySelectorAll('.tab[data-tab-id]')].map(el => Number(el.dataset.tabId));
    tabs.sort((a, b) => orderedIds.indexOf(a.id) - orderedIds.indexOf(b.id));
  }

  // ---- drag a tab onto the page area to open split screen ----
  // Nota: il <webview> mangia gli eventi drag, quindi durante il trascinamento
  // mostriamo un overlay a tutto schermo sopra l'area pagina che intercetta il drop.
  let dropZone = null;

  function setDropZone(zone) {
    dropZone = zone;
    viewContainer.classList.toggle('drop-left', zone === 'left');
    viewContainer.classList.toggle('drop-right', zone === 'right');
    dropCols.forEach(c => c.classList.toggle('hover', c.dataset.zone === zone));
  }

  function showDropOverlay() {
    // Ha senso solo se ci sono almeno 2 schede con cui fare split.
    if (tabs.length < 2) return;
    dropOverlay.classList.add('active');
  }

  function hideDropOverlay() {
    dropOverlay.classList.remove('active');
    setDropZone(null);
  }

  // Apertura animata: righe e colonne scivolano al target con easeOutCubic.
  function animateSplitSizes(from, to, dur = 300) {
    cancelAnimationFrame(ratioAnimId);
    if (!splitState) return;
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      splitState.rows = to.rows.slice();
      splitState.cols = to.cols.slice();
      if (splitState && showingSplit) applySplitGrid();
      return;
    }
    const t0 = performance.now();
    const step = (now) => {
      if (!splitState) return;
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      splitState.rows = from.rows.map((f, i) => f + (to.rows[i] - f) * e);
      splitState.cols = from.cols.map((f, i) => f + (to.cols[i] - f) * e);
      if (splitState && showingSplit) applySplitGrid();
      if (p < 1) ratioAnimId = requestAnimationFrame(step);
    };
    ratioAnimId = requestAnimationFrame(step);
  }

  function doSplitDrop(zone, clientY) {
    if (draggedTabId == null || zone == null) return;
    if (!getTab(draggedTabId)) return;

    // Trascinare una scheda già nello split = solo fuoco + mostra.
    if (splitState && isInSplit(draggedTabId)) {
      showingSplit = true;
      splitState.focus = draggedTabId;
      applyLayout();
      return;
    }

    // Nessuno split: crea lo split a 2 dal lato di drop.
    if (!splitState) {
      const otherId = activeTabId;
      if (otherId == null) return;
      if (draggedTabId === otherId) return; // can't split a tab with itself
      if (!getTab(otherId)) return;
      const panes = zone === 'left' ? [draggedTabId, otherId] : [otherId, draggedTabId];
      const startCols = zone === 'left' ? [22, 78] : [78, 22];
      splitState = { panes, rows: [100], cols: startCols.slice(), focus: draggedTabId };
      showingSplit = true;
      splitEnterSide = zone;
      applyLayout();
      animateSplitSizes({ rows: [100], cols: startCols }, { rows: [100], cols: [50, 50] });
      return;
    }

    const n = splitState.panes.length;

    // Split pieno (4): sostituisce il pannello nel quadrante di drop.
    if (n >= 4) {
      let idx = zone === 'left' ? 2 : 3;
      if (typeof clientY === 'number') {
        const rect = viewContainer.getBoundingClientRect();
        const top = (clientY - rect.top) < rect.height / 2;
        idx = (top ? 0 : 2) + (zone === 'left' ? 0 : 1);
      }
      if (splitState.panes[idx] === draggedTabId) {
        showingSplit = true;
        splitState.focus = draggedTabId;
        applyLayout();
        return;
      }
      splitState.panes[idx] = draggedTabId;
      splitState.focus = draggedTabId;
      showingSplit = true;
      splitEnterSide = zone;
      applyLayout();
      return;
    }

    if (n === 2) {
      // 2→3: uno sopra a tutta larghezza + due sotto.
      // Drop a destra: [A,B,C] (C sotto-destra). Drop a sinistra: [A,C,B] (C sotto-sinistra).
      if (zone === 'left') splitState.panes.splice(1, 0, draggedTabId);
      else splitState.panes.push(draggedTabId);
      splitState.rows = [80, 20];
      splitState.cols = [50, 50];
      splitState.focus = draggedTabId;
      showingSplit = true;
      splitEnterSide = zone;
      applyLayout();
      animateSplitSizes({ rows: [80, 20], cols: [50, 50] }, { rows: [55, 45], cols: [50, 50] });
      return;
    }

    // 3→4: il nuovo va nella riga sotto, dal lato di drop. Proporzioni invariate.
    if (zone === 'left') splitState.panes.splice(2, 0, draggedTabId);
    else splitState.panes.push(draggedTabId);
    splitState.focus = draggedTabId;
    showingSplit = true;
    splitEnterSide = zone;
    applyLayout();
  }

  dropCols.forEach(col => {
    col.addEventListener('dragover', (e) => {
      if (draggedTabId == null) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      setDropZone(col.dataset.zone);
    });
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const zone = col.dataset.zone;
      // Salva l'id prima che dragend lo azzeri.
      const id = draggedTabId ?? Number(e.dataTransfer.getData('text/plain'));
      draggedTabId = id;
      doSplitDrop(zone, e.clientY);
      hideDropOverlay();
    });
  });

  dropOverlay.addEventListener('dragover', (e) => {
    if (draggedTabId == null) return;
    e.preventDefault();
  });
  dropOverlay.addEventListener('dragleave', (e) => {
    if (e.target === dropOverlay) setDropZone(null);
  });
  dropOverlay.addEventListener('drop', (e) => {
    // Fallback se il drop avviene tra le due colonne: calcola dalla X.
    e.preventDefault();
    const rect = dropOverlay.getBoundingClientRect();
    const zone = (e.clientX - rect.left) < rect.width / 2 ? 'left' : 'right';
    const id = draggedTabId ?? Number(e.dataTransfer.getData('text/plain'));
    draggedTabId = id;
    doSplitDrop(zone, e.clientY);
    hideDropOverlay();
  });

  // Sicurezza: se il drag finisce fuori, nascondi comunque l'overlay.
  document.addEventListener('dragend', hideDropOverlay);

  // Fallback: tiene il vecchio comportamento se l'overlay non è attivo.
  viewContainer.addEventListener('dragover', (e) => {
    if (draggedTabId == null) return;
    e.preventDefault();
    const rect = viewContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width * 0.5) setDropZone('left');
    else setDropZone('right');
  });

  viewContainer.addEventListener('dragleave', (e) => {
    if (e.target === viewContainer) setDropZone(null);
  });

  viewContainer.addEventListener('drop', (e) => {
    e.preventDefault();
    const zone = dropZone;
    setDropZone(null);
    doSplitDrop(zone, e.clientY);
  });

  // ---- divider drag-to-resize (ogni giunto ridimensiona le due tracce vicine) ----
  window.addEventListener('mousemove', (e) => {
    if (!resizing || !splitState) return;
    const arr = resizing.type === 'h' ? splitState.rows : splitState.cols;
    const start = resizeStartSizes;
    const total = start[resizing.gap] + start[resizing.gap + 1];
    const cur = resizing.type === 'h' ? e.clientY : e.clientX;
    const origin = resizing.type === 'h' ? resizeStartY : resizeStartX;
    let a = start[resizing.gap] + ((cur - origin) / resizeWidth) * 100;
    a = Math.max(12, Math.min(total - 12, a));
    arr[resizing.gap] = a;
    arr[resizing.gap + 1] = total - a;
    applySplitGrid();
  });
  window.addEventListener('mouseup', () => {
    if (resizing) {
      resizing = null;
      dividerEls.forEach(d => d.classList.remove('dragging'));
    }
  });

  newTabBtn.addEventListener('click', () => createTab());

  urlForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const tab = getFocusedTab();
    if (tab) tab.webview.loadURL(normalizeUrl(urlBar.value));
    urlBar.blur();
  });

  backBtn.addEventListener('click', () => { const t = getFocusedTab(); if (t && t.webview.canGoBack()) t.webview.goBack(); });
  forwardBtn.addEventListener('click', () => { const t = getFocusedTab(); if (t && t.webview.canGoForward()) t.webview.goForward(); });
  reloadBtn.addEventListener('click', () => { const t = getFocusedTab(); if (t) t.webview.reload(); });
  talkBtn.addEventListener('click', () => createTab('https://zenaix.netlify.app/'));

  window.addEventListener('keydown', (e) => {
    const ctrlOrCmd = e.ctrlKey || e.metaKey;
    if (ctrlOrCmd && e.key === 't') { e.preventDefault(); createTab(); }
    if (ctrlOrCmd && e.key === 'w') { e.preventDefault(); const t = getFocusedTab(); if (t) closeTab(t.id); }
    if (ctrlOrCmd && e.key === 'l') { e.preventDefault(); urlBar.focus(); urlBar.select(); }
    if (ctrlOrCmd && e.key === 'r') { e.preventDefault(); reloadBtn.click(); }
    if (ctrlOrCmd && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
      e.preventDefault();
      try { if (window.browserAPI && window.browserAPI.toggleDevTools) window.browserAPI.toggleDevTools(); } catch (err) {}
    }
    if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && splitState && showingSplit) {
      e.preventDefault();
      const n = splitState.panes.length;
      const i = splitState.panes.indexOf(splitState.focus);
      splitState.focus = splitState.panes[(i + (e.key === 'ArrowLeft' ? -1 : 1) + n) % n];
      applyLayout();
    }
  });

  // ================= KOA Browser · sidebar + footer =================
  const sideToggle = document.getElementById('side-toggle');
  const chatMsgs = document.getElementById('chat-msgs');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const qaNew = document.getElementById('qa-new');
  const qaSplit = document.getElementById('qa-split');

  sideToggle.addEventListener('click', () => {
    document.getElementById('app').classList.toggle('side-collapsed');
  });

  // ---- soft sounds (WebAudio, nessun asset esterno) ----
  let audioCtx = null;
  function koaTone(freq = 660, dur = 0.07, delay = 0) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.05, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) {}
  }

  // ---- Chat KOA: comandi locali, conversazione completa nel tab KOA ----
  function openKoa() { createTab('https://zenaix.netlify.app/'); }

  function addMsg(who, text, withKoaBtn) {
    const row = document.createElement('div');
    row.className = 'msg ' + who;
    const av = document.createElement('span');
    av.className = 'avatar';
    av.textContent = who === 'koa' ? 'K' : 'Tu';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    if (withKoaBtn) {
      const btn = document.createElement('button');
      btn.className = 'linklike';
      btn.textContent = 'Apri la chat KOA completa';
      btn.addEventListener('click', openKoa);
      b.appendChild(document.createElement('br'));
      b.appendChild(btn);
    }
    row.append(av, b);
    chatMsgs.appendChild(row);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
    return b;
  }

  function safeCalc(expr) {
    const clean = expr.replace(/\^/g, '**').trim();
    if (!clean || !/^[0-9+\-*/().,%\s*]+$/.test(clean)) return null;
    try {
      const val = Function('"use strict"; return (' + clean + ')')();
      if (typeof val !== 'number' || !isFinite(val)) return null;
      return Math.round(val * 1e10) / 1e10;
    } catch (e) { return null; }
  }

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = chatInput.value.trim();
    if (!raw) return;
    addMsg('user', raw);
    chatInput.value = '';
    koaTone(520);
    setTimeout(() => {
      if (/^\/(calc|calcola)\s+/i.test(raw)) {
        const res = safeCalc(raw.replace(/^\/(calc|calcola)\s+/i, ''));
        addMsg('koa', res === null ? 'Non riesco a calcolarlo: uso solo numeri e + - * / % ( ) ^' : '= ' + res);
        koaTone(740, 0.09, 0.02);
      } else if (/^\/(cerca|search|c)\s+/i.test(raw)) {
        const q = raw.replace(/^\/(cerca|search|c)\s+/i, '');
        createTab('https://www.google.com/search?q=' + encodeURIComponent(q));
        addMsg('koa', 'Ho aperto la ricerca per "' + q + '" in una nuova scheda.');
        koaTone(740, 0.09, 0.02);
      } else if (/^\/(riassumi|riassunto)/i.test(raw)) {
        summarizeCurrentPage();
        koaTone(740, 0.09, 0.02);
      } else if (/^\/(aiuto|help)/i.test(raw)) {
        addMsg('koa', '/calc 2+2*3 — calcolatrice\n/cerca gatti — apre la ricerca\n/riassumi — riassume la pagina aperta\nOppure scrivimi direttamente: ti rispondo con la AI, conoscendo la pagina che hai aperta:', true);
        koaTone(740, 0.09, 0.02);
      } else {
        askKoaAI(raw);
      }
    }, 220);
  });

  // ---- ZEN Supervisor: pannello live anti-tracker + anti-pubblicità ----
  const supToggle = document.getElementById('sup-toggle');
  const supState = document.getElementById('sup-state');
  const supTotal = document.getElementById('sup-total');
  const supLast = document.getElementById('sup-last');
  let supervisorOn = true;
  try { supervisorOn = (localStorage.getItem('koa.supervisor') ?? '1') === '1'; } catch (e) {}
  supToggle.checked = supervisorOn;

  function renderSupervisor(s) {
    if (s && typeof s.on === 'boolean') supervisorOn = s.on;
    supToggle.checked = supervisorOn;
    if (s && typeof s.total === 'number') supTotal.textContent = s.total;
    if (s && s.last) {
      supLast.textContent = s.last;
      supLast.title = s.last;
    }
    if (!supervisorOn) {
      supState.textContent = 'SPENTO';
      supState.classList.remove('on');
    } else if (s && s.ready) {
      supState.textContent = 'ATTIVO';
      supState.classList.add('on');
    } else {
      supState.textContent = 'CARICAMENTO…';
      supState.classList.remove('on');
    }
  }

  supToggle.addEventListener('change', () => {
    supervisorOn = supToggle.checked;
    try { localStorage.setItem('koa.supervisor', supervisorOn ? '1' : '0'); } catch (e) {}
    renderSupervisor(null);
    try {
      if (window.browserAPI && window.browserAPI.setSupervisor) {
        const r = window.browserAPI.setSupervisor(supervisorOn);
        if (r && typeof r.then === 'function') r.then(renderSupervisor).catch(() => {});
      }
    } catch (e) {}
  });

  try {
    if (window.browserAPI && window.browserAPI.onSupervisorStats) {
      window.browserAPI.onSupervisorStats(renderSupervisor);
    }
    if (window.browserAPI && window.browserAPI.setSupervisor) {
      const r = window.browserAPI.setSupervisor(supervisorOn);
      if (r && typeof r.then === 'function') r.then(renderSupervisor).catch(() => {});
    }
  } catch (e) {}
  renderSupervisor(null);

  // ---- Azioni rapide ----
  qaNew.addEventListener('click', () => createTab());
  qaSplit.addEventListener('click', () => {
    if (splitState && showingSplit) { showingSplit = false; applyLayout(); return; }
    if (tabs.length < 2) { createTab(); return; }
    const focusTab = getFocusedTab() || tabs[tabs.length - 1];
    const other = [...tabs].reverse().find(t => t.id !== focusTab.id);
    if (!other) return;
    splitState = { panes: [other.id, focusTab.id], rows: [100], cols: [78, 22], focus: focusTab.id };
    showingSplit = true;
    splitEnterSide = 'right';
    applyLayout();
    animateSplitSizes({ rows: [100], cols: [78, 22] }, { rows: [100], cols: [50, 50] });
  });

  // ---- Scrollbar liquida nei siti: il gradiente scorre su/giù con la pagina ----
  // Gira DENTRO ogni webview: thumb con gradiente KOA + listener scroll (passive)
  // che sposta il gradiente in base a scrollY. Nulla lascia il browser.
  function koaScrollbarInit() {
    if (window.__koaScrollInit) return 'already';
    window.__koaScrollInit = true;
    try {
      var css = '::-webkit-scrollbar{width:12px;height:12px}'
        + '::-webkit-scrollbar-track{background:rgba(42,28,18,0.55)}'
        + '::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#E86A2C,#E8A83C,#D9B36A,#E86A2C);background-size:100% 300px;border-radius:8px;border:2px solid rgba(42,28,18,0.9);background-position:0 var(--koa-scroll,0px)}'
        + '::-webkit-scrollbar-thumb:hover{border-color:#E86A2C}'
        + '::-webkit-scrollbar-corner{background:transparent}';
      var s = document.createElement('style');
      s.id = 'koa-scrollbar';
      s.textContent = css;
      (document.head || document.documentElement).appendChild(s);
      var root = document.documentElement;
      var ticking = false;
      function onScroll() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          ticking = false;
          var y = window.scrollY || root.scrollTop || 0;
          root.style.setProperty('--koa-scroll', (-(y % 300)) + 'px');
        });
      }
      window.addEventListener('scroll', onScroll, { passive: true, capture: true });
      onScroll();
      return 'ok';
    } catch (e) { return 'fail'; }
  }

  function injectKoaScrollbar(wv) {
    try {
      if (!wv || !wv.executeJavaScript) return;
      const p = wv.executeJavaScript('(' + koaScrollbarInit.toString() + ')()', true);
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ---- KOA Summarizer: riassunto locale della pagina aperta ----
  const chatSummarizeBtn = document.getElementById('chat-summarize');
  const KOA_STOPWORDS = ('di a da in con su per tra fra il lo la i gli le un uno una che non si come anche ma se più meno molto ' +
    'questo questa questi queste quello quella quelli quelle sono era erano stato stata ho hai ha abbiamo avete hanno ' +
    'fare fa fanno può possono deve devono essere avere nel nella nei nelle del della dei delle dal dalla al alla allo ai agli alle ' +
    'sul sulla sui sulle col coi ed o e ci ne li loro lui lei noi voi essi quale quali quanto quanta quando dove perche cosa ' +
    'tutto tutti tutta tutte ogni solo ancora sempre mai già molti molte pochi poche altro altra altri altre stesso stessa senza ' +
    'sopra sotto dopo prima durante mentre fino verso oltre tale tali ecco quindi poi invece').split(/\s+/);

  // Gira DENTRO il webview: restituisce il blocco di testo più ricco (article > main > body).
  function koaExtractPage() {
    function inner(el) {
      try { return (el.innerText || '').replace(/\s+/g, ' ').trim(); } catch (e) { return ''; }
    }
    var cands = [document.querySelector('article'), document.querySelector('main'), document.querySelector('[role="main"]'), document.body];
    var best = '';
    for (var i = 0; i < cands.length; i++) {
      if (!cands[i]) continue;
      var t = inner(cands[i]);
      if (t.length > best.length) best = t;
    }
    return { title: document.title || '', text: best.slice(0, 15000) };
  }

  // Summarizer estrattivo: frasi con parole più frequenti (stopword italiane escluse).
  function summarizeText(text, title) {
    var clean = text.replace(/\s+/g, ' ').trim();
    var parts;
    try { parts = clean.split(/(?<=[.!?…])\s+(?=[A-ZÀ-Þ0-9"«'”])/); }
    catch (e) { parts = clean.split(/[.?!…]\s+/); }
    var sents = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].trim();
      if (s.length >= 40 && s.length <= 400) sents.push(s);
    }
    if (sents.length === 0) return 'Il testo della pagina è troppo breve per farne un riassunto.';
    var stop = {};
    KOA_STOPWORDS.forEach(function (w) { stop[w] = 1; });
    var freq = {};
    sents.forEach(function (s) {
      var ws = s.toLowerCase().match(/[a-zà-ÿ']+/g) || [];
      ws.forEach(function (w) { if (!stop[w] && w.length > 2) freq[w] = (freq[w] || 0) + 1; });
    });
    var scored = sents.map(function (s, idx) {
      var ws = s.toLowerCase().match(/[a-zà-ÿ']+/g) || [];
      var sc = 0, n = 0;
      ws.forEach(function (w) { if (!stop[w] && w.length > 2) { sc += freq[w] || 0; n++; } });
      sc = n ? sc / Math.sqrt(n) : 0;
      if (idx < 3) sc *= 1.12;
      return { s: s, idx: idx, sc: sc };
    });
    var N = Math.min(5, Math.max(2, Math.round(sents.length / 6)));
    scored.sort(function (a, b) { return b.sc - a.sc; });
    var top = scored.slice(0, N).sort(function (a, b) { return a.idx - b.idx; });
    var head = 'Riassunto' + (title ? ' di «' + title + '»' : '') + ' (' + sents.length + ' frasi → ' + top.length + '):\n\n';
    return head + top.map(function (x) { return '• ' + x.s; }).join('\n');
  }

  function summarizeCurrentPage() {
    const tab = getFocusedTab();
    if (!tab) { addMsg('koa', 'Non c’è nessuna pagina aperta da riassumere.'); return; }
    const thinking = addMsg('koa', 'Sto leggendo "' + shortTitle(tab.title, 30) + '"…');
    const done = (res) => {
      if (!res || !res.text || res.text.trim().length < 300) {
        thinking.textContent = 'Non riesco a leggere abbastanza testo da questa pagina (forse è vuota o protetta).';
        return;
      }
      thinking.textContent = summarizeText(res.text, res.title);
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
      koaTone(880, 0.08);
    };
    try {
      const r = tab.webview.executeJavaScript('(' + koaExtractPage.toString() + ')()', true);
      if (r && r.then) r.then(done).catch(() => done(null));
      else done(r);
    } catch (e) { done(null); }
  }
  chatSummarizeBtn.addEventListener('click', summarizeCurrentPage);

  // ---- KOA AI via Pollinations (gratis, senza chiave): tutto il resto passa da qui ----
  const KOA_SYSTEM = 'Sei KOA, l’assistente AI integrato di KOA Browser. Rispondi sempre in italiano, in modo conciso e utile, con Markdown leggero. ' +
    'Nel browser esistono i comandi /calc (calcolatrice), /cerca (apre una ricerca) e /riassumi (riassume la pagina): se l’utente li nomina, spiega come usarli.';

  // Contesto pagina per la AI: titolo + inizio del testo (riuso l’estrattore del summarizer).
  function koaPageContext() {
    return new Promise((resolve) => {
      const tab = getFocusedTab();
      if (!tab) return resolve('');
      try {
        const r = tab.webview.executeJavaScript('(' + koaExtractPage.toString() + ')()', true);
        const done = (res) => {
          if (!res || !res.text) return resolve('');
          resolve('\n\nContesto — pagina aperta dall’utente:\nTitolo: ' + (res.title || '?') + '\nTesto: ' + res.text.slice(0, 2000));
        };
        if (r && r.then) r.then(done).catch(() => resolve(''));
        else done(r);
      } catch (e) { resolve(''); }
    });
  }

  function askKoaAI(question) {
    const thinking = addMsg('koa', 'Sto pensando…');
    const finish = (text) => {
      thinking.textContent = text;
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
      koaTone(740, 0.09, 0.02);
    };
    koaPageContext().then((ctx) => {
      const prompt = KOA_SYSTEM + ctx + '\n\nUtente: ' + question + '\nKOA:';
      const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt) + '?private=true';
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 60000);
      fetch(url, { signal: ctrl.signal, headers: { Accept: 'text/plain' } })
        .then((res) => {
          clearTimeout(timer);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then((txt) => {
          const clean = (txt || '').trim();
          finish(clean || 'Non ho ricevuto risposta. Riprova tra poco.');
        })
        .catch(() => finish('Non riesco a raggiungere KOA AI in questo momento (controlla la rete e riprova).'));
    });
  }

  addMsg('koa', 'Ciao, sono KOA con AI. Scrivimi pure — conosco anche la pagina che hai aperta. Comandi: /calc, /cerca, /riassumi, /aiuto', false);

  // ================= ZENdate MAX · impostazioni + aggiornamenti =================
  const settingsBtn = document.getElementById('settings-btn');
  const settingsModal = document.getElementById('settings-modal');
  const settingsVersion = document.getElementById('settings-version');
  const updateStatus = document.getElementById('update-status');
  const updateFill = document.querySelector('#update-progress i');
  const updateNotes = document.getElementById('update-notes');
  const zendateCheck = document.getElementById('zendate-check');
  const settingsClose = document.getElementById('settings-close');

  async function refreshVersion() {
    for (let i = 0; i < 4; i++) {
      try {
        if (window.browserAPI && window.browserAPI.getVersion) {
          const v = await window.browserAPI.getVersion();
          if (v) { settingsVersion.textContent = 'v' + v; return; }
        }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 500));
    }
    settingsVersion.textContent = 'v?';
  }
  refreshVersion();

  function openSettings() { settingsModal.hidden = false; refreshVersion(); }
  function closeSettings() { settingsModal.hidden = true; }
  settingsBtn.addEventListener('click', openSettings);
  settingsClose.addEventListener('click', closeSettings);
  settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettings(); });

  let checkFallbackTimer = 0;

  function handleUpdateStatus(s) {
    if (!s) return;
    clearTimeout(checkFallbackTimer);
    if (['up-to-date', 'no-channel', 'error', 'installed'].includes(s.state)) {
      zendateCheck.disabled = false;
    }
    try { localStorage.setItem('koa.zendate-last', JSON.stringify({ t: Date.now(), state: s.state, version: s.version || '' })); } catch (e) {}
    switch (s.state) {
      case 'checking':
        updateStatus.textContent = s.source === 'auto' ? 'ZENdate: controllo automatico…' : 'Controllo aggiornamenti…';
        break;
      case 'no-channel':
        updateStatus.textContent = 'Canale ZENdate non configurato (vedi ZENDATE_URL in main.js).';
        break;
      case 'up-to-date':
        updateStatus.textContent = 'KOA è aggiornato (v' + (s.version || '?') + ').';
        updateFill.style.width = '0%';
        break;
      case 'found':
        updateStatus.textContent = 'Trovata v' + s.version + ' — download…';
        updateFill.style.width = '0%';
        openSettings();
        break;
      case 'downloading':
        updateStatus.textContent = 'Download v' + s.version + '… ' + (s.percent || 0) + '%';
        updateFill.style.width = (s.percent || 0) + '%';
        openSettings();
        break;
      case 'ready':
        updateStatus.textContent = 'Verificata v' + s.version + ' — installazione…';
        updateFill.style.width = '100%';
        break;
      case 'installing':
        updateStatus.textContent = 'Installazione… KOA si riavvia da solo.';
        updateFill.style.width = '100%';
        break;
      case 'installed':
        updateStatus.textContent = 'Aggiornato alla v' + s.version + '!';
        updateFill.style.width = '100%';
        openSettings();
        break;
      case 'error':
        updateStatus.textContent = 'Errore ZENdate: ' + (s.message || 'rete non disponibile');
        break;
    }
    if (s.notes) updateNotes.textContent = s.notes;
  }

  try {
    if (window.browserAPI && window.browserAPI.onUpdateStatus) window.browserAPI.onUpdateStatus(handleUpdateStatus);
  } catch (e) {}

  zendateCheck.addEventListener('click', () => {
    updateStatus.textContent = 'Controllo aggiornamenti…';
    updateFill.style.width = '0%';
    updateNotes.textContent = '';
    zendateCheck.disabled = true;
    clearTimeout(checkFallbackTimer);
    checkFallbackTimer = setTimeout(() => {
      if (/Controllo|controllo automatico/.test(updateStatus.textContent)) {
        updateStatus.textContent = 'Ancora in controllo… se resta bloccato, riavvia KOA e riprova.';
        zendateCheck.disabled = false;
      }
    }, 45000);
    try {
      if (window.browserAPI && window.browserAPI.checkUpdate) window.browserAPI.checkUpdate();
    } catch (e) { zendateCheck.disabled = false; }
  });

  try {
    const last = JSON.parse(localStorage.getItem('koa.zendate-last') || 'null');
    if (last && last.state) updateStatus.textContent = 'Ultima verifica: ' + last.state + (last.version ? ' (v' + last.version + ')' : '');
  } catch (e) {}

  createTab();
</script>
