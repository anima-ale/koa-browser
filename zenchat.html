<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZEN 7.5 MAX · KOA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a09; color: #f0f0f0;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    display: flex; justify-content: center;
    min-height: 100vh;
  }
  .wrap {
    width: min(760px, 100vw); min-height: 100vh;
    display: flex; flex-direction: column;
    border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a;
    animation: neo1In 0.2s ease-out;
  }
  @keyframes neo1In { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: #141414;
    border-bottom: 1px solid #2a2a2a;
  }
  header .kicker {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #9a9a9a;
  }
  header .badge {
    font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: #e8b04b; color: #0a0a09;
    border-radius: 4px; padding: 2px 8px;
  }
  header .spacer { flex: 1; }
  header a {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #9a9a9a; text-decoration: none;
  }
  header a:hover { color: #f0f0f0; }
  #msgs {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg { animation: msgIn 0.22s ease-out; max-width: 100%; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg .who {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #9a9a9a; margin-bottom: 6px;
  }
  .msg.ai .who { color: #e8b04b; }
  .msg.user { align-self: flex-end; background: #1e1e1e; border: 1px solid #2a2a2a;
    border-radius: 8px 2px 8px 8px; padding: 10px 14px; max-width: 85%; }
  .msg.ai { align-self: flex-start; background: #141414; border: 1px solid #2a2a2a;
    border-radius: 2px 8px 8px 8px; padding: 10px 14px; max-width: 92%; }
  .msg .body { font-size: 0.92rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #f0f0f0; }
  .msg .body code { background: #1e1e1e; border: 1px solid #2a2a2a; color: #e8b04b;
    border-radius: 3px; padding: 1px 5px; font-family: ui-monospace, monospace; font-size: 0.85em; }
  .msg.loading .body { color: #9a9a9a; font-family: ui-monospace, monospace; font-size: 11px; }
  .msg.loading .body .dots { color: #e8b04b; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
  footer { padding: 10px; border-top: 1px solid #2a2a2a; background: #0a0a09; }
  #form { display: flex; gap: 8px; }
  #input {
    flex: 1; min-width: 0; background: #0a0a09; color: #f0f0f0;
    border: 1px solid #2a2a2a; border-radius: 6px;
    caret-color: #e8b04b; font-size: 15px; padding: 11px 13px; outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: #e8b04b; }
  #send {
    background: #e8b04b; border: 1px solid #e8b04b; color: #0a0a09;
    border-radius: 6px; font-family: ui-monospace, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0 18px; cursor: pointer;
  }
  #send:hover { background: #f0c06a; }
  #send:disabled { opacity: 0.5; cursor: default; }
  ::selection { background: #2e2c29; color: #f0f0f0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">KOA · chat</span>
    <span class="badge">ZEN 7.5 MAX</span>
    <span class="spacer"></span>
    <a href="#" id="keys-link" title="Imposta chiavi API gratuite (Gemini / Pollen)">Chiavi</a>
    <a href="start.html">Home</a>
  </header>
  <div id="msgs"></div>
  <footer>
    <form id="form">
      <input id="input" type="text" placeholder="Continua a chiedere…" autocomplete="off" />
      <button id="send" type="submit">Invia</button>
    </form>
  </footer>
</div>
<script>
(function () {
  var msgs = document.getElementById('msgs');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderCode(text) {
    var parts = String(text).split('`');
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      out += (i % 2 === 1) ? '<code>' + esc(parts[i]) + '</code>' : esc(parts[i]);
    }
    return out;
  }
  function addMsg(who, text, loading) {
    var d = document.createElement('div');
    d.className = 'msg ' + who + (loading ? ' loading' : '');
    var w = document.createElement('div');
    w.className = 'who';
    w.textContent = who === 'ai' ? 'ZEN 7.5 MAX' : 'TU';
    var b = document.createElement('div');
    b.className = 'body';
    if (loading) {
      b.innerHTML = 'pensiero in corso <span class="dots">...</span>';
    } else {
      b.innerHTML = renderCode(text);
    }
    d.appendChild(w);
    d.appendChild(b);
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return b;
  }
  function hist() {
    try {
      const h = JSON.parse(localStorage.getItem('koa.zenchat-hist') || '[]');
      return Array.isArray(h) ? h : [];
    } catch (e) { return []; }
  }
  function saveHist(h) {
    try { localStorage.setItem('koa.zenchat-hist', JSON.stringify(h.slice(-50))); } catch (e) {}
  }
  var busy = false;
  function zenKeys() {
    try {
      return {
        pollen: (localStorage.getItem('koa.pollen-key') || '').trim(),
        gemini: (localStorage.getItem('koa.gemini-key') || '').trim()
      };
    } catch (e) { return { pollen: '', gemini: '' }; }
  }
  function zenPickText(t) {
    t = String(t == null ? '' : t).trim();
    if (!t || t === '{}' || t === '[]') throw new Error('empty');
    if (t.charAt(0) === '{' && t.charAt(t.length - 1) === '}') {
      try {
        var j = JSON.parse(t);
        var c = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (c && String(c).trim() && String(c).trim() !== '{}') return String(c).trim();
        if (j.text && String(j.text).trim() && String(j.text).trim() !== '{}') return String(j.text).trim();
      } catch (e) {
        if (e && (e.message === 'empty')) throw e;
      }
      throw new Error('empty');
    }
    return t;
  }
  async function zenViaGemini(messages, apiKey) {
    var contents = [];
    messages.forEach(function (m) {
      var role = m.role === 'assistant' ? 'model' : 'user';
      var text = String((m && m.content) || '').slice(0, 4000);
      if (!text.trim()) return;
      contents.push({ role: role, parts: [{ text: text }] });
    });
    if (!contents.length) throw new Error('empty');
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: contents, generationConfig: { temperature: 0.7, maxOutputTokens: 2048 } })
    });
    if (!r.ok) throw new Error('gemini ' + r.status);
    var j = await r.json();
    var out = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0] && j.candidates[0].content.parts[0].text;
    if (!out || !String(out).trim()) throw new Error('empty');
    return String(out).trim();
  }
  async function zenViaPollenGen(messages, apiKey) {
    var r = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({ model: 'openai/gpt-5.4-nano', messages: messages, stream: false })
    });
    if (!r.ok) throw new Error('pollen ' + r.status);
    var t = await r.text();
    return zenPickText(t);
  }
  async function zenViaLLM7(messages) {
    var models = ['default', 'DeepSeek-V4-Flash-0731', 'GLM-5.3-Flash', 'minimax-m2.7', 'mistral-Nemo-Instruct-2407', 'codestral-latest'];
    var lastErr = null, limited = false;
    for (var i = 0; i < models.length; i++) {
      try {
        var r = await fetch('https://api.llm7.io/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer unused' },
          body: JSON.stringify({ model: models[i], messages: messages, stream: false })
        });
        if (r.status === 429) { limited = true; lastErr = new Error('429'); continue; }
        if (!r.ok) { lastErr = new Error('llm7 ' + r.status); continue; }
        return zenPickText(await r.text());
      } catch (e) { lastErr = e; }
    }
    if (limited) throw new Error('limite richieste (riprova tra ~20s)');
    throw lastErr || new Error('llm7');
  }
  async function askZen(messages) {
    messages = (messages || []).filter(function (m) { return m && typeof m.content === 'string' && m.content.trim(); });
    if (!messages.length) throw new Error('vuoto');
    var keys = zenKeys();
    var errs = [];
    if (keys.gemini) {
      try { return await zenViaGemini(messages, keys.gemini); }
      catch (e) { errs.push('gemini: ' + ((e && e.message) || 'errore')); }
    }
    if (keys.pollen) {
      try { return await zenViaPollenGen(messages, keys.pollen); }
      catch (e) { errs.push('pollen: ' + ((e && e.message) || 'errore')); }
    }
    try { return await zenViaLLM7(messages); }
    catch (e) { errs.push('gratis: ' + ((e && e.message) || 'errore')); }
    try {
      var r = await fetch('https://text.pollinations.ai/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages })
      });
      if (r.ok) {
        var t = await r.text();
        return zenPickText(t);
      } else if (r.status === 402) {
        errs.push('pollinations: pagamento richiesto (402) per nuove richieste');
      } else {
        errs.push('pollinations: HTTP ' + r.status);
      }
    } catch (e) {
      if (e && e.message === 'empty') errs.push('pollinations: risposta vuota ({})');
      else if (e) errs.push('pollinations: ' + (e.message || 'rete'));
    }
    try {
      var last = messages.filter(function (m) { return typeof m.content === 'string'; }).pop();
      var prompt = ((last && last.content) || 'ciao').slice(0, 500);
      var r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt));
      if (r2.ok) {
        var t2 = await r2.text();
        return zenPickText(t2);
      } else if (r2.status === 402) {
        errs.push('pollinations-get: pagamento richiesto (402)');
      } else {
        errs.push('pollinations-get: HTTP ' + r2.status);
      }
    } catch (e) {
      if (e && e.message === 'empty') errs.push('pollinations-get: risposta vuota ({})');
    }
    throw new Error(errs.length ? errs.join(' · ') : 'vuoto');
  }
  async function sendText(q) {
    q = (q || '').trim();
    if (!q || busy) return;
    busy = true;
    send.disabled = true;
    input.value = '';
    const h = hist();
    h.push({ who: 'user', text: q });
    addMsg('user', q, false);
    const bubble = addMsg('ai', '', true);
    try {
      const ctx = h.slice(-12).map(m => ({ role: m.who === 'ai' ? 'assistant' : 'user', content: String(m.text).slice(0, 1200) }));
      const a = await askZen(ctx);
      h.push({ who: 'ai', text: a });
      saveHist(h);
      bubble.parentNode.querySelector('.who').textContent = 'ZEN 7.5 MAX';
      bubble.parentNode.classList.remove('loading');
      bubble.innerHTML = renderCode(a);
    } catch (e) {
      bubble.parentNode.classList.remove('loading');
      var msg = (e && e.message) || 'rete';
      if (/limite richieste/i.test(msg)) {
        bubble.innerHTML = renderCode('ZEN è al limite gratuito (10 richieste/minuto): aspetta ~20 secondi e riprova.');
      } else if (/402|pagamento|empty|vuota|\(\{\}\)/i.test(msg)) {
        bubble.innerHTML = renderCode('ZEN non risponde (' + msg + '). Riprova tra poco: la via gratuita primaria è attiva, Pollinations legacy è a pagamento per le nuove richieste.');
      } else {
        bubble.textContent = 'ZEN non risponde (' + msg + '): controlla la rete e riprova.';
      }
    }
    msgs.scrollTop = msgs.scrollHeight;
    busy = false;
    send.disabled = false;
    input.focus();
  }
  hist().forEach(m => addMsg(m.who === 'ai' ? 'ai' : 'user', m.text, false));
  try {
    var kl = document.getElementById('keys-link');
    if (kl) kl.addEventListener('click', function (e) {
      e.preventDefault();
      try {
        var curG = localStorage.getItem('koa.gemini-key') || '';
        var curP = localStorage.getItem('koa.pollen-key') || '';
        var g = window.prompt('Gemini API key (gratis da Google AI Studio, lascia vuoto per non cambiare):', curG);
        if (g != null) {
          g = (g || '').trim();
          if (g) localStorage.setItem('koa.gemini-key', g);
          else localStorage.removeItem('koa.gemini-key');
        }
        var p = window.prompt('Pollen API key (da enter.pollinations.ai, lascia vuoto per non cambiare):', curP);
        if (p != null) {
          p = (p || '').trim();
          if (p) localStorage.setItem('koa.pollen-key', p);
          else localStorage.removeItem('koa.pollen-key');
        }
      } catch (err) {}
    });
  } catch (e) {}
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    sendText(input.value);
  });
  input.focus();
})();
</script>
</body>
</html>
