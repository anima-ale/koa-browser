<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZEN 7.5 MAX · KOA</title>
<style>
  /* KOA 1.0.34 · Chat ZEN — Apple HIG */
  :root {
    color-scheme: dark light;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
    --label: #ffffff;
    --label-2: rgba(235, 235, 245, 0.62);
    --label-3: rgba(235, 235, 245, 0.36);
    --bg: #0c0c0e;
    --bg-elevated: #161618;
    --fill: rgba(120, 120, 128, 0.24);
    --fill-2: rgba(120, 120, 128, 0.16);
    --fill-3: rgba(120, 120, 128, 0.10);
    --hairline: rgba(255, 255, 255, 0.08);
    --material: rgba(24, 24, 27, 0.78);
    --material-thick: rgba(20, 20, 22, 0.90);
    --tint: #ff8a5b;
    --tint-strong: #ff9d74;
    --tint-fill: rgba(255, 138, 91, 0.16);
    --tint-ring: rgba(255, 138, 91, 0.30);
    --on-tint: #1b0e08;
    --red: #ff453a;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.26), 0 18px 50px rgba(0, 0, 0, 0.32);
    --spring: linear(0, 0.018 1.5%, 0.075 3.4%, 0.23 6.2%, 0.52 10%, 0.79 14%,
              0.94 18%, 1.01 23%, 1.02 27%, 1.008 34%, 1 46%, 1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --label: #000000;
      --label-2: rgba(60, 60, 67, 0.62);
      --label-3: rgba(60, 60, 67, 0.38);
      --bg: #f5f5f7;
      --bg-elevated: #ffffff;
      --fill: rgba(118, 118, 128, 0.16);
      --fill-2: rgba(118, 118, 128, 0.11);
      --fill-3: rgba(118, 118, 128, 0.07);
      --hairline: rgba(0, 0, 0, 0.08);
      --material: rgba(255, 255, 255, 0.78);
      --material-thick: rgba(255, 255, 255, 0.92);
      --tint: #cf4f1d;
      --tint-strong: #b9410f;
      --tint-fill: rgba(207, 79, 29, 0.10);
      --tint-ring: rgba(207, 79, 29, 0.24);
      --on-tint: #ffffff;
      --red: #d70015;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.10);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--label);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    letter-spacing: -0.08px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(255, 138, 91, 0.28); color: var(--label); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--fill); border: 3px solid transparent; border-radius: 99px; background-clip: content-box; }

  .wrap {
    width: min(820px, 100vw);
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-elevated);
    border-left: 1px solid var(--hairline);
    border-right: 1px solid var(--hairline);
    animation: wrap-in 380ms var(--spring);
  }
  @keyframes wrap-in {
    from { opacity: 0; transform: translateY(6px) scale(0.995); }
    to { opacity: 1; transform: none; }
  }

  header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 14px 18px;
    flex-shrink: 0;
    background: var(--material);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border-bottom: 1px solid var(--hairline);
  }
  header .kicker { font-size: 12.5px; font-weight: 600; letter-spacing: -0.1px; color: var(--label); }
  header .badge {
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--tint-fill);
    border: 1px solid var(--tint-ring);
    color: var(--tint);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  header .spacer { flex: 1; }
  header a {
    color: var(--label-2);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 7px;
    transition: background-color 140ms ease, color 140ms ease, transform 100ms ease;
  }
  header a:hover { background: var(--fill-3); color: var(--label); }
  header a:active { transform: scale(0.95); }

  #msgs {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px 18px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .msg { max-width: 100%; animation: msg-in 300ms var(--spring); }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(7px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }
  .msg .who {
    margin-bottom: 5px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--label-3);
  }
  .msg.ai .who { color: var(--tint); }
  .msg.user {
    align-self: flex-end;
    max-width: 82%;
    padding: 10px 14px;
    background: var(--tint);
    border-radius: 16px 16px 5px 16px;
    color: var(--on-tint);
  }
  .msg.user .who { color: var(--on-tint); opacity: 0.62; }
  .msg.ai {
    align-self: flex-start;
    max-width: 92%;
    padding: 11px 15px;
    background: var(--fill-3);
    border: 1px solid var(--hairline);
    border-radius: 16px 16px 16px 5px;
  }
  .msg .body {
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--label);
  }
  .msg.user .body { color: var(--on-tint); }
  .msg .body code {
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--fill-2);
    border: 1px solid var(--hairline);
    color: var(--label);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.86em;
  }
  .msg.loading .body { color: var(--label-2); font-size: 12.5px; }
  .msg.loading .body .dots { color: var(--tint); animation: dots 1.2s ease-in-out infinite; }
  @keyframes dots { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

  footer {
    flex-shrink: 0;
    padding: 12px 14px 14px;
    background: var(--material);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border-top: 1px solid var(--hairline);
  }
  #form {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 5px 5px 14px;
    background: var(--fill-3);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    transition: border-color 160ms ease, box-shadow 240ms ease, background-color 160ms ease;
  }
  #form:focus-within { border-color: var(--tint); box-shadow: 0 0 0 4px var(--tint-ring); background: var(--bg-elevated); }
  #input {
    flex: 1;
    min-width: 0;
    height: 36px;
    border: none;
    background: transparent;
    color: var(--label);
    font-family: var(--font);
    font-size: 14.5px;
    letter-spacing: -0.12px;
    caret-color: var(--tint);
    outline: none;
  }
  #input::placeholder { color: var(--label-3); }
  #send {
    flex-shrink: 0;
    height: 36px;
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: var(--tint);
    color: var(--on-tint);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 600;
    cursor: default;
    transition: background-color 140ms ease, transform 100ms ease, opacity 140ms ease;
  }
  #send:hover { background: var(--tint-strong); }
  #send:active { transform: scale(0.96); }
  #send:disabled { opacity: 0.45; }
  #send:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">KOA · Chat</span>
    <span class="badge">ZEN 7.5 MAX</span>
    <span class="spacer"></span>
    <a href="start.html">Home</a>
  </header>
  <div id="msgs"></div>
  <footer>
    <form id="form">
      <input id="input" type="text" placeholder="Scrivi a ZEN…" autocomplete="off" />
      <button id="send" type="submit">Invia</button>
    </form>
  </footer>
</div>
<script>
(function () {
  var msgs = document.getElementById('msgs');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var send = document.getElementById('send');
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function renderCode(text) {
    var parts = String(text).split('`');
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      out += (i % 2 === 1) ? '<code>' + esc(parts[i]) + '</code>' : esc(parts[i]);
    }
    return out;
  }
  function addMsg(who, text, loading) {
    var d = document.createElement('div');
    d.className = 'msg ' + who + (loading ? ' loading' : '');
    var w = document.createElement('div');
    w.className = 'who';
    w.textContent = who === 'ai' ? 'ZEN 7.5 MAX' : 'TU';
    var b = document.createElement('div');
    b.className = 'body';
    if (loading) {
      b.innerHTML = 'pensiero in corso <span class="dots">...</span>';
    } else {
      b.innerHTML = renderCode(text);
    }
    d.appendChild(w);
    d.appendChild(b);
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return b;
  }
  function hist() {
    try {
      const h = JSON.parse(localStorage.getItem('koa.zenchat-hist') || '[]');
      return Array.isArray(h) ? h : [];
    } catch (e) { return []; }
  }
  function saveHist(h) {
    try { localStorage.setItem('koa.zenchat-hist', JSON.stringify(h.slice(-50))); } catch (e) {}
  }
  var busy = false;
  function zenKeys() {
    try {
      return {
        pollen: (localStorage.getItem('koa.pollen-key') || '').trim(),
        gemini: (localStorage.getItem('koa.gemini-key') || '').trim()
      };
    } catch (e) { return { pollen: '', gemini: '' }; }
  }
  function zenPickText(t) {
    t = String(t == null ? '' : t).trim();
    if (!t || t === '{}' || t === '[]') throw new Error('empty');
    if (t.charAt(0) === '{' && t.charAt(t.length - 1) === '}') {
      try {
        var j = JSON.parse(t);
        var c = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (c && String(c).trim() && String(c).trim() !== '{}') return String(c).trim();
        if (j.text && String(j.text).trim() && String(j.text).trim() !== '{}') return String(j.text).trim();
      } catch (e) {
        if (e && (e.message === 'empty')) throw e;
      }
      throw new Error('empty');
    }
    return t;
  }
  async function zenViaGemini(messages, apiKey) {
    var contents = [];
    messages.forEach(function (m) {
      var role = m.role === 'assistant' ? 'model' : 'user';
      var text = String((m && m.content) || '').slice(0, 4000);
      if (!text.trim()) return;
      contents.push({ role: role, parts: [{ text: text }] });
    });
    if (!contents.length) throw new Error('empty');
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(apiKey), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: contents, generationConfig: { temperature: 0.7, maxOutputTokens: 2048 } })
    });
    if (!r.ok) throw new Error('gemini ' + r.status);
    var j = await r.json();
    var out = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0] && j.candidates[0].content.parts[0].text;
    if (!out || !String(out).trim()) throw new Error('empty');
    return String(out).trim();
  }
  async function zenViaPollenGen(messages, apiKey) {
    var r = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({ model: 'openai/gpt-5.4-nano', messages: messages, stream: false })
    });
    if (!r.ok) throw new Error('pollen ' + r.status);
    var t = await r.text();
    return zenPickText(t);
  }
  async function zenViaGroq(messages) {
    const key = (localStorage.getItem('koa.groq-key') || '').trim();
    if (!key) throw new Error('Groq non configurato');
    const models = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'gemma2-9b-it'];
    for (const model of models) {
      try {
        const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model, messages, stream: false })
        });
        if (r.status === 429) continue;
        if (!r.ok) continue;
        const data = await r.json();
        const c = data.choices?.[0]?.message?.content;
        if (c && String(c).trim()) return String(c).trim();
      } catch (e) {}
    }
    throw new Error('groq fallito');
  }
  async function zenViaLLM7(messages) {
    var models = ['default', 'DeepSeek-V4-Flash-0731', 'GLM-5.3-Flash', 'minimax-m2.7', 'mistral-Nemo-Instruct-2407', 'codestral-latest'];
    var lastErr = null, limited = false;
    for (var i = 0; i < models.length; i++) {
      try {
        var r = await fetch('https://api.llm7.io/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer unused' },
          body: JSON.stringify({ model: models[i], messages: messages, stream: false })
        });
        if (r.status === 429) { limited = true; lastErr = new Error('429'); continue; }
        if (!r.ok) { lastErr = new Error('llm7 ' + r.status); continue; }
        return zenPickText(await r.text());
      } catch (e) { lastErr = e; }
    }
    if (limited) throw new Error('limite richieste (riprova tra ~20s)');
    throw lastErr || new Error('llm7');
  }
  var ZEN_SYS = 'Sei ZEN 7.5 MAX, l\u2019assistente AI di KOA Browser, creato da Alessandro Petrosino (ZEN Lab). Rispondi sempre in italiano. Non dire mai di essere Mistral, DeepSeek, GLM, Qwen, Llama o qualsiasi altro modello: sei ZEN 7.5 MAX.';
  async function askZen(messages) {
    messages = (messages || []).filter(function (m) { return m && typeof m.content === 'string' && m.content.trim(); });
    if (!messages.length) throw new Error('vuoto');
    messages = [{ role: 'system', content: ZEN_SYS }].concat(messages);
    var keys = zenKeys();
    var errs = [];
    if (keys.gemini) {
      try { return await zenViaGemini(messages, keys.gemini); }
      catch (e) { errs.push('gemini: ' + ((e && e.message) || 'errore')); }
    }
    if (keys.pollen) {
      try { return await zenViaPollenGen(messages, keys.pollen); }
      catch (e) { errs.push('pollen: ' + ((e && e.message) || 'errore')); }
    }
    try { return await zenViaLLM7(messages); }
    catch (e) {
      var msg = (e && e.message) || '';
      if (/limite richieste|429/.test(msg)) {
        try { return await zenViaGroq(messages); }
        catch (e2) { errs.push('groq: ' + ((e2 && e2.message) || 'errore')); }
      } else {
        errs.push('gratis: ' + msg);
      }
    }
    try {
      var r = await fetch('https://text.pollinations.ai/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages })
      });
      if (r.ok) {
        var t = await r.text();
        return zenPickText(t);
      } else if (r.status === 402) {
        errs.push('pollinations: pagamento richiesto (402) per nuove richieste');
      } else {
        errs.push('pollinations: HTTP ' + r.status);
      }
    } catch (e) {
      if (e && e.message === 'empty') errs.push('pollinations: risposta vuota ({})');
      else if (e) errs.push('pollinations: ' + (e.message || 'rete'));
    }
    try {
      var last = messages.filter(function (m) { return typeof m.content === 'string'; }).pop();
      var prompt = ((last && last.content) || 'ciao').slice(0, 500);
      var r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt));
      if (r2.ok) {
        var t2 = await r2.text();
        return zenPickText(t2);
      } else if (r2.status === 402) {
        errs.push('pollinations-get: pagamento richiesto (402)');
      } else {
        errs.push('pollinations-get: HTTP ' + r2.status);
      }
    } catch (e) {
      if (e && e.message === 'empty') errs.push('pollinations-get: risposta vuota ({})');
    }
    throw new Error(errs.length ? errs.join(' · ') : 'vuoto');
  }
  async function sendText(q) {
    q = (q || '').trim();
    if (!q || busy) return;
    busy = true;
    send.disabled = true;
    input.value = '';
    const h = hist();
    h.push({ who: 'user', text: q });
    addMsg('user', q, false);
    const bubble = addMsg('ai', '', true);
    try {
      const ctx = h.slice(-12).map(m => ({ role: m.who === 'ai' ? 'assistant' : 'user', content: String(m.text).slice(0, 1200) }));
      const a = await askZen(ctx);
      h.push({ who: 'ai', text: a });
      saveHist(h);
      bubble.parentNode.querySelector('.who').textContent = 'ZEN 7.5 MAX';
      bubble.parentNode.classList.remove('loading');
      bubble.innerHTML = renderCode(a);
    } catch (e) {
      bubble.parentNode.classList.remove('loading');
      var msg = (e && e.message) || 'rete';
      if (/limite richieste/i.test(msg)) {
        bubble.innerHTML = renderCode('ZEN è al limite gratuito (10 richieste/minuto): aspetta ~20 secondi e riprova.');
      } else if (/402|pagamento|empty|vuota|\(\{\}\)/i.test(msg)) {
        bubble.innerHTML = renderCode('ZEN non risponde (' + msg + '). Riprova tra poco: la via gratuita primaria è attiva, Pollinations legacy è a pagamento per le nuove richieste.');
      } else {
        bubble.textContent = 'ZEN non risponde (' + msg + '): controlla la rete e riprova.';
      }
    }
    msgs.scrollTop = msgs.scrollHeight;
    busy = false;
    send.disabled = false;
    input.focus();
  }
  hist().forEach(m => addMsg(m.who === 'ai' ? 'ai' : 'user', m.text, false));
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    sendText(input.value);
  });
  input.focus();
})();
</script>
</body>
</html>
