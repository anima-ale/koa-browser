<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZEN Moon · KOA</title>
<style>
  :root {
    --bg: #0c0c10;
    --panel: #141419;
    --line: rgba(251, 191, 36, 0.22);
    --gold: #fbbf24;
    --gold-dim: rgba(251, 191, 36, 0.14);
    --text: #f3ede2;
    --muted: #9a917f;
    --green: #4ade80;
    --font: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 500px at 50% -10%, rgba(251, 191, 36, 0.08), transparent), var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex; flex-direction: column;
    height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(20, 20, 25, 0.9);
  }
  .moon-mark {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fde68a, var(--gold) 60%, #92400e);
    box-shadow: 0 0 18px rgba(251, 191, 36, 0.45);
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.08em; }
  header h1 small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; font-weight: 400; }
  header .spacer { flex: 1; }
  select, button {
    font-family: var(--font);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12.5px;
  }
  select { max-width: 240px; }
  button { cursor: pointer; }
  button.primary { background: var(--gold); color: #111; border-color: transparent; font-weight: 700; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: transparent; }
  #status {
    padding: 8px 18px;
    font-size: 12px; color: var(--muted);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    min-height: 34px;
  }
  #status .bar { height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; margin-top: 6px; overflow: hidden; display: none; }
  #status .bar.on { display: block; }
  #status .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #9d4edd); transition: width 0.2s; }
  #msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: rgba(251, 191, 36, 0.14); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.09); border-bottom-left-radius: 4px; }
  .msg.ai pre { background: #000; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; }
  .msg.sys { align-self: center; font-size: 11.5px; color: var(--muted); }
  form { display: flex; gap: 10px; padding: 12px 18px 16px 18px; border-top: 1px solid var(--line); background: rgba(20, 20, 25, 0.9); }
  textarea {
    flex: 1; resize: none; height: 44px;
    background: #000; color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-family: var(--font); font-size: 13.5px; outline: none;
  }
  textarea:focus { border-color: var(--gold); }
</style>
</head>
<body>
<header>
  <div class="moon-mark"></div>
  <h1>ZEN MOON<small>modello sul tuo dispositivo · gratis, privato, offline dopo il download</small></h1>
  <div class="spacer"></div>
  <select id="model-sel" title="Modello locale"></select>
  <button id="clear-btn" class="ghost" title="Svuota conversazione">Svuota</button>
</header>
<div id="status">Pronto. Il primo uso scarica i pesi (una volta sola), poi tutto resta nel dispositivo.</div>
<div id="msgs"></div>
<form id="form">
  <textarea id="input" placeholder="Scrivi in italiano… (Invio per inviare)"></textarea>
  <button id="send" class="primary" type="submit">Invia</button>
</form>
<script type="module">
  // ZEN Moon per KOA: motore locale proprio (WebGPU/WebLLM -> CPU wllama -> cloud Pollinations).
  // ZEN su Netlify NON viene toccato: solo gli ID modello sono gli stessi.
  const GPU_MODELS = [
    { id: 'SmolLM2-135M-Instruct-q0f16-MLC', label: 'SmolLM2 135M · ~150MB · velocissimo' },
    { id: 'SmolLM2-360M-Instruct-q4f16_1-MLC', label: 'SmolLM2 360M · ~300MB · leggero' },
    { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: 'Qwen 0.5B · ~400MB · italiano ok' },
    { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC', label: 'Llama 1B · ~800MB' },
    { id: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', label: 'Qwen 1.5B · ~1GB · consigliato su PC' },
    { id: 'Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC', label: 'Qwen Coder 1.5B · ~1GB · codice' },
    { id: 'Qwen2.5-3B-Instruct-q4f16_1-MLC', label: 'Qwen 3B · ~2GB · solo PC potenti' },
    { id: 'Qwen2.5-Coder-3B-Instruct-q4f16_1-MLC', label: 'Qwen Coder 3B · ~2GB · codice' },
    { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC', label: 'Llama 3B · ~2GB · alternativa' },
    { id: 'Hermes-3-Llama-3.2-3B-q4f16_1-MLC', label: 'Hermes 3B · ~2GB · creativo' }
  ];
  const CPU_MODELS = [
    { repo: 'Qwen/Qwen2.5-0.5B-Instruct-GGUF', file: 'qwen2.5-0.5b-instruct-q4_k_m.gguf', label: 'Qwen 0.5B CPU · ~400MB' },
    { repo: 'bartowski/Qwen2.5-Coder-0.5B-Instruct-GGUF', file: 'Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf', label: 'Qwen Coder 0.5B CPU · ~400MB' },
    { repo: 'Qwen/Qwen2.5-1.5B-Instruct-GGUF', file: 'qwen2.5-1.5b-instruct-q4_k_m.gguf', label: 'Qwen 1.5B CPU · ~1GB' }
  ];
  const WLLAMA_BASE = 'https://cdn.jsdelivr.net/npm/wllama/esm/';
  const SYS_GPU = 'Sei ZEN Moon, assistente AI che gira sul dispositivo dell\u2019utente. Scrivi SOLO in italiano corretto, frasi semplici e chiare. Rispondi in modo conciso ma completo. Il codice HTML va in un blocco ```html completo e autonomo.';
  const SYS_CPU = 'Sei ZEN Moon su CPU locale. Scrivi SOLO in italiano corretto, frasi semplicissime. Rispondi MOLTO breve: massimo 5 righe.';

  const $ = (id) => document.getElementById(id);
  const sel = $('model-sel'), statusEl = $('status'), msgsEl = $('msgs'),
        form = $('form'), input = $('input'), sendBtn = $('send');

  const params = new URLSearchParams(location.search);
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.deviceMemory || 8) <= 4;
  let kind = params.get('kind') === 'cpu' ? 'cpu' : 'gpu';
  let modelId = params.get('model') || (isMobile ? 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC' : 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC');

  GPU_MODELS.forEach(m => {
    const o = document.createElement('option');
    o.value = 'gpu|' + m.id; o.textContent = m.label;
    sel.appendChild(o);
  });
  CPU_MODELS.forEach(m => {
    const o = document.createElement('option');
    o.value = 'cpu|' + m.repo + '|' + m.file; o.textContent = m.label + ' (CPU)';
    sel.appendChild(o);
  });
  function syncSel() {
    const v = kind === 'cpu'
      ? 'cpu|' + (CPU_MODELS.find(m => (modelId || '').includes(m.file)) || CPU_MODELS[0]).repo + '|' + (CPU_MODELS.find(m => (modelId || '').includes(m.file)) || CPU_MODELS[0]).file
      : 'gpu|' + ((GPU_MODELS.some(m => m.id === modelId) ? modelId : null) || (isMobile ? 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC' : 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC'));
    sel.value = v;
    applySel();
  }
  function applySel() {
    const [k, ...rest] = (sel.value || '').split('|');
    kind = k === 'cpu' ? 'cpu' : 'gpu';
    modelId = rest.join('|');
  }
  sel.addEventListener('change', () => { applySel(); dropEngines(); say('sys', 'Modello: ' + sel.options[sel.selectedIndex].textContent); });
  syncSel();

  let gpuEngine = null, gpuEngineModel = null, gpuLoading = null;
  let cpuEngine = null, cpuEngineModel = null, cpuLoading = null;
  function dropEngines() { gpuEngine = null; gpuEngineModel = null; cpuEngine = null; cpuEngineModel = null; }
  function setStatus(t, pct) {
    statusEl.innerHTML = '';
    statusEl.append(document.createTextNode(t));
    let bar = statusEl.querySelector('.bar');
    if (!bar) { bar = document.createElement('div'); bar.className = 'bar'; bar.appendChild(document.createElement('i')); statusEl.appendChild(bar); }
    const fill = bar.querySelector('i');
    if (pct == null) bar.classList.remove('on');
    else { bar.classList.add('on'); fill.style.width = Math.max(0, Math.min(100, pct)) + '%'; }
  }
  function say(who, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    msgsEl.appendChild(d);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return d;
  }
  function history() {
    try { return JSON.parse(localStorage.getItem('koa.moon-hist') || '[]'); } catch (e) { return []; }
  }
  function saveHist(h) {
    try { localStorage.setItem('koa.moon-hist', JSON.stringify(h.slice(-50))); } catch (e) {}
  }
  history().forEach(m => say(m.who, m.text));

  async function ensureGpu() {
    if (!navigator.gpu) throw new Error('WebGPU non disponibile');
    if (gpuEngine && gpuEngineModel === modelId) return gpuEngine;
    if (gpuLoading) { await gpuLoading; if (gpuEngine) return gpuEngine; }
    gpuLoading = (async () => {
      const { CreateMLCEngine } = await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm');
      const eng = await CreateMLCEngine(modelId, {
        initProgressCallback: (p) => setStatus('Primo avvio: scarico modello… ' + Math.round((p.progress || 0) * 100) + '%', (p.progress || 0) * 100)
      });
      gpuEngine = eng; gpuEngineModel = modelId;
    })();
    try { await gpuLoading; } finally { gpuLoading = null; }
    if (!gpuEngine) throw new Error('motore GPU non inizializzato');
    return gpuEngine;
  }
  async function ensureCpu() {
    const m = CPU_MODELS.find(x => modelId.includes(x.file)) || CPU_MODELS[0];
    const key = m.repo + '|' + m.file;
    if (cpuEngine && cpuEngineModel === key) return cpuEngine;
    if (cpuLoading) { await cpuLoading; if (cpuEngine) return cpuEngine; }
    cpuLoading = (async () => {
      const { Wllama } = await import(WLLAMA_BASE + 'index.js');
      const w = new Wllama({ 'single-thread/wllama.wasm': WLLAMA_BASE + 'single-thread/wllama.wasm' });
      const threads = Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2));
      await w.loadModelFromHF(m.repo, m.file, {
        n_threads: threads,
        progressCallback: ({ loaded, total }) => {
          const pct = total ? Math.round((loaded / total) * 100) : 0;
          setStatus('Scarico modello CPU… ' + pct + '%', pct);
        }
      });
      cpuEngine = w; cpuEngineModel = key;
    })();
    try { await cpuLoading; } finally { cpuLoading = null; }
    if (!cpuEngine) throw new Error('motore CPU non inizializzato');
    return cpuEngine;
  }
  function tail(h, n, maxLen) {
    return h.filter(m => m.who !== 'sys').slice(-n * 2).map(m => ({
      role: m.who === 'user' ? 'user' : 'assistant',
      content: String(m.text || '').slice(0, maxLen)
    }));
  }
  const withTimeout = (p, ms, label) => Promise.race([
    p, new Promise((_, rej) => setTimeout(() => rej(new Error(label)), ms))
  ]);
  async function askLocal(prompt) {
    const h = history();
    if (kind === 'cpu') {
      const w = await ensureCpu();
      setStatus('Elaboro in CPU (lento)…');
      const msgs = [{ role: 'system', content: SYS_CPU }, ...tail(h, 2, 800), { role: 'user', content: prompt.slice(0, 1000) }];
      const text = await withTimeout(w.createChatCompletion(msgs, { nPredict: 512, sampling: { temp: 0.2, top_k: 20, top_p: 0.85 } }), 300000, 'Timeout CPU (300s)');
      if (typeof text !== 'string' || !text.trim()) throw new Error('risposta CPU vuota');
      return text.trim();
    }
    const eng = await ensureGpu();
    setStatus('Elaboro sul dispositivo…');
    const msgs = [{ role: 'system', content: SYS_GPU }, ...tail(h, 4, 1500), { role: 'user', content: prompt.slice(0, 2000) }];
    const out = await withTimeout(eng.chat.completions.create({ messages: msgs, temperature: 0.2, top_p: 0.9, max_tokens: 1024 }), 300000, 'Timeout GPU (300s)');
    const text = out && out.choices && out.choices[0] && out.choices[0].message && out.choices[0].message.content;
    if (typeof text !== 'string' || !text.trim()) throw new Error('risposta GPU vuota');
    return text.trim();
  }
  async function askCloud(prompt) {
    setStatus('Dispositivo non disponibile: uso il cloud…');
    const body = { messages: [{ role: 'user', content: prompt.slice(0, 2000) }], model: 'openai' };
    try {
      const r = await fetch('https://text.pollinations.ai/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (r.ok) { const t = await r.text(); if (t.trim()) return t.trim(); }
    } catch (e) {}
    const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt.slice(0, 500)));
    const t2 = await r2.text();
    if (!t2.trim()) throw new Error('cloud senza risposta');
    return t2.trim();
  }
  let busy = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const prompt = input.value.trim();
    if (!prompt || busy) return;
    busy = true; sendBtn.disabled = true;
    input.value = '';
    say('user', prompt);
    const h = history(); h.push({ who: 'user', text: prompt }); saveHist(h);
    const bubble = say('ai', '…');
    try {
      let answer = '';
      try { answer = await askLocal(prompt); }
      catch (err) {
        if (kind === 'gpu') {
          try {
            kind = 'cpu';
            const m = CPU_MODELS[0];
            modelId = m.repo + '|' + m.file;
            syncSel();
            answer = await askLocal(prompt);
          } catch (e2) { answer = await askCloud(prompt); }
        } else { answer = await askCloud(prompt); }
      }
      bubble.textContent = answer;
      const h2 = history(); h2.push({ who: 'ai', text: answer }); saveHist(h2);
      setStatus(kind === 'cpu' ? 'Pronto (CPU).' : 'Pronto sul dispositivo.');
    } catch (err) {
      bubble.textContent = 'Errore: ' + (err.message || 'richiesta fallita');
      setStatus('Errore. Riprova.');
    } finally {
      busy = false; sendBtn.disabled = false;
      msgsEl.scrollTop = msgsEl.scrollHeight;
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  $('clear-btn').addEventListener('click', () => {
    saveHist([]); msgsEl.innerHTML = '';
    say('sys', 'Conversazione svuotata.');
  });
  setStatus('Pronto. Il primo uso scarica i pesi (una volta sola), poi tutto resta nel dispositivo.');
</script>
</body>
</html>
