<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>KOA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: #1C130D radial-gradient(700px 380px at 50% 30%, rgba(232, 106, 44, 0.14), transparent 65%);
    color: #F5EDE0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
  }
  img { width: 84px; height: 84px; }
  h1 { font-size: 30px; letter-spacing: 0.28em; font-weight: 700; }
  form { width: min(560px, 92vw); display: flex; }
  .aiwrap {
    --mx: 50%; --my: 50%; --glow: 0;
    flex: 1; border-radius: 99px; padding: 1.5px;
    background:
      radial-gradient(circle 130px at var(--mx) var(--my),
        rgba(255, 170, 80, calc(0.95 * var(--glow))) 0%,
        rgba(232, 106, 44, calc(0.55 * var(--glow))) 42%,
        rgba(232, 106, 44, 0) 72%),
      #1f130c;
    box-shadow: 0 0 26px rgba(232, 106, 44, calc(0.35 * var(--glow)));
  }
  input {
    width: 100%; height: 44px; border-radius: 99px;
    border: none; background: rgba(0, 0, 0, 0.55); color: #F5EDE0;
    font-size: 15px; padding: 0 22px; outline: none;
  }
  input:focus { box-shadow: 0 0 0 3px rgba(232, 106, 44, 0.16); }
  .tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tiles a {
    color: #B9A58C; text-decoration: none; font-size: 13px; font-weight: 600;
    border: 1px solid #6B4A2E; border-radius: 8px; padding: 9px 16px;
    background: rgba(62, 42, 26, 0.5);
  }
  .tiles a:hover { color: #E86A2C; border-color: #E86A2C; }
</style>
</head>
<body>
  <img src="assets/logo.png" alt="KOA" />
  <h1>KOA</h1>
  <form action="https://www.google.com/search" method="GET">
    <div class="aiwrap"><input name="q" placeholder="Cerca con Google" autocomplete="off" autofocus /></div>
  </form>
  <div class="tiles">
    <a href="https://www.google.com">Google</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://www.wikipedia.org">Wikipedia</a>
  </div>
<script>
(function () {
  var w = document.querySelector('.aiwrap');
  var inp = document.querySelector('.aiwrap input');
  if (!w || !inp) return;
  var R = 320, tx = 0.5, ty = 0.5, x = 0.5, y = 0.5;
  var tglow = 0, glow = 0, focused = false, idle = 99;
  function track(e) {
    var r = w.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    var d = Math.sqrt(dx * dx + dy * dy);
    var p = Math.max(0, 1 - d / R);
    tglow = p * p;
    tx = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    ty = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    idle = 0;
  }
  document.addEventListener('mousemove', track, { passive: true });
  document.addEventListener('mouseleave', function () { tglow = 0; });
  inp.addEventListener('focus', function () { focused = true; });
  inp.addEventListener('blur', function () { focused = false; });
  (function loop() {
    idle += 0.016;
    x += (tx - x) * 0.18;
    y += (ty - y) * 0.18;
    glow += (tglow - glow) * 0.15;
    var ix = x, iy = y;
    if (idle > 3 && !focused) {
      var t = performance.now() / 1000;
      ix = 0.5 + 0.32 * Math.sin(t * 0.5);
      iy = 0.5 + 0.2 * Math.cos(t * 0.34);
    }
    var g = focused ? Math.max(glow, 0.9) : glow;
    w.style.setProperty('--mx', (ix * 100).toFixed(2) + '%');
    w.style.setProperty('--my', (iy * 100).toFixed(2) + '%');
    w.style.setProperty('--glow', Math.max(0, Math.min(1, g)).toFixed(3));
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
