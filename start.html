<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>KOA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0a0a09; color: #f0f0f0;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    display: flex; justify-content: center;
    min-height: 100vh;
  }
  .wrap {
    width: min(760px, 100vw); min-height: 100vh;
    display: flex; flex-direction: column;
    border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a;
    animation: neo1In 0.2s ease-out;
  }
  @keyframes neo1In { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: #141414;
    border-bottom: 1px solid #2a2a2a;
  }
  header .kicker {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #9a9a9a;
  }
  header .badge {
    font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: #e8b04b; color: #0a0a09;
    border-radius: 4px; padding: 2px 8px;
  }
  header .spacer { flex: 1; }
  main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 24px 14px;
  }
  img { width: 72px; height: 72px; }
  h1 {
    font-size: 22px; font-weight: 700; letter-spacing: 0.28em;
    color: #f0f0f0; margin-left: 0.28em;
  }
  .sub {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #9a9a9a;
  }
  form { width: 100%; display: flex; }
  .aiwrap {
    flex: 1; min-width: 0;
    background: #141414; border: 1px solid #2a2a2a;
    border-radius: 2px 8px 8px 8px;
    animation: msgIn 0.22s ease-out;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .bar-row { display: flex; gap: 8px; padding: 10px; }
  .bar-row input {
    flex: 1; min-width: 0; background: #0a0a09; color: #f0f0f0;
    border: 1px solid #2a2a2a; border-radius: 6px;
    caret-color: #e8b04b; font-size: 15px; padding: 11px 13px; outline: none;
    font-family: inherit;
  }
  .bar-row input:focus { border-color: #e8b04b; }
  #zenmode {
    flex-shrink: 0;
    background: #e8b04b; border: 1px solid #e8b04b; color: #0a0a09;
    border-radius: 6px; font-family: ui-monospace, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 0 18px; cursor: pointer; white-space: nowrap;
  }
  #zenmode:hover { background: #f0c06a; }
  #zenmode:disabled { opacity: 0.5; cursor: default; }
  #zen-answer {
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 0.55s ease, opacity 0.4s ease;
    margin: 0 10px;
  }
  #zen-answer.open { max-height: 340px; opacity: 1; margin: 0 10px 10px 10px; }
  #zen-answer .who {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; color: #e8b04b; margin-bottom: 6px;
  }
  #zen-text {
    font-size: 0.92rem; line-height: 1.6; color: #f0f0f0;
    max-height: 190px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  #zen-text .caret::after { content: "▍"; color: #e8b04b; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #zen-err { font-size: 13px; color: #bf616a; margin-top: 6px; }
  #zen-err:empty { display: none; }
  .zen-actions { display: flex; gap: 8px; margin-top: 10px; }
  .zen-actions button {
    flex: 1; height: 38px; border-radius: 6px; cursor: pointer;
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  #zen-continue { background: #e8b04b; border: 1px solid #e8b04b; color: #0a0a09; }
  #zen-continue:hover { background: #f0c06a; }
  #zen-continue:disabled { opacity: 0.5; cursor: default; }
  #zen-google { background: transparent; border: 1px solid #2a2a2a; color: #f0f0f0; }
  #zen-google:hover { border-color: #e8b04b; }
  .tiles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .tiles a {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; text-decoration: none;
    color: #9a9a9a; border: 1px solid #2a2a2a; border-radius: 6px;
    padding: 8px 14px; background: #141414;
  }
  .tiles a:hover { color: #f0f0f0; border-color: #e8b04b; }
  ::selection { background: #2e2c29; color: #f0f0f0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">KOA · home</span>
    <span class="badge">ZEN 7.5 MAX</span>
    <span class="spacer"></span>
  </header>
  <main>
  <img src="assets/logo.png" alt="KOA" />
  <h1>KOA</h1>
  <div class="sub">Chiedi a ZEN o cerca</div>
  <form id="zoa-form" action="https://www.google.com/search" method="GET">
    <div class="aiwrap" id="aiwrap">
      <div class="bar-row">
        <input id="zoa-input" name="q" placeholder="Continua a chiedere…" autocomplete="off" autofocus />
        <button id="zenmode" type="button" title="Chiedi a ZEN 7.5 MAX">ZEN mode</button>
      </div>
      <div id="zen-answer">
        <div class="who">ZEN 7.5 MAX</div>
        <div id="zen-text"></div>
        <div id="zen-err"></div>
        <div class="zen-actions" id="zen-actions" hidden>
          <button id="zen-continue" type="button">Continua conversazione</button>
          <button id="zen-google" type="button">Cerca su Google</button>
        </div>
      </div>
    </div>
  </form>
  <div class="tiles">
    <a href="https://www.google.com">Google</a>
    <a href="https://www.youtube.com">YouTube</a>
    <a href="https://github.com">GitHub</a>
    <a href="https://www.wikipedia.org">Wikipedia</a>
  </div>
  </main>
</div>
<script>
(function () {
  var inp = document.getElementById('zoa-input');
  var form = document.getElementById('zoa-form');
  var zm = document.getElementById('zenmode');
  var box = document.getElementById('zen-answer');
  var txt = document.getElementById('zen-text');
  var err = document.getElementById('zen-err');
  var acts = document.getElementById('zen-actions');
  if (!inp) return;
  // --- ZEN mode: chiede a ZEN 7.5 MAX, la barra si allunga con la risposta ---
  var busy = false, lastQ = '', lastA = '';
  function hist() {
    try { return JSON.parse(localStorage.getItem('koa.zenchat-hist') || '[]'); } catch (e) { return []; }
  }
  function saveHist(h) {
    try { localStorage.setItem('koa.zenchat-hist', JSON.stringify(h.slice(-30))); } catch (e) {}
  }
  async function askZen(q) {
    var messages = [
      { role: 'system', content: 'Sei ZEN 7.5 MAX, l\u2019assistente AI di KOA Browser, creato da Alessandro Petrosino (ZEN Lab). Rispondi sempre in italiano. Non dire mai di essere Mistral, DeepSeek, GLM, Qwen, Llama o qualsiasi altro modello: sei ZEN 7.5 MAX.' },
      { role: 'user', content: String(q || '').slice(0, 1500) }
    ];
    function pickText(t) {
      t = String(t == null ? '' : t).trim();
      if (!t || t === '{}' || t === '[]') throw new Error('empty');
      if (t.charAt(0) === '{' && t.charAt(t.length - 1) === '}') {
        try {
          var j = JSON.parse(t);
          var c = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
          if (c && String(c).trim() && String(c).trim() !== '{}') return String(c).trim();
          if (j.text && String(j.text).trim()) return String(j.text).trim();
        } catch (e) { if (e && e.message === 'empty') throw e; }
        throw new Error('empty');
      }
      return t;
    }
    var gemKey = '', polKey = '';
    try {
      gemKey = (localStorage.getItem('koa.gemini-key') || '').trim();
      polKey = (localStorage.getItem('koa.pollen-key') || '').trim();
    } catch (e) {}
    if (gemKey) {
      try {
        var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + encodeURIComponent(gemKey), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: messages[0].content }] }], generationConfig: { temperature: 0.7, maxOutputTokens: 2048 } })
        });
        if (r.ok) {
          var j = await r.json();
          var out = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0] && j.candidates[0].content.parts[0].text;
          if (out && String(out).trim()) return String(out).trim();
        }
      } catch (e) {}
    }
    if (polKey) {
      try {
        var rp = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + polKey },
          body: JSON.stringify({ model: 'openai/gpt-5.4-nano', messages: messages, stream: false })
        });
        if (rp.ok) return pickText(await rp.text());
      } catch (e) {}
    }
    try {
      var models = ['default', 'DeepSeek-V4-Flash-0731', 'GLM-5.3-Flash', 'minimax-m2.7', 'mistral-Nemo-Instruct-2407', 'codestral-latest'];
      for (var i = 0; i < models.length; i++) {
        try {
          var rl = await fetch('https://api.llm7.io/v1/chat/completions', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer unused' },
            body: JSON.stringify({ model: models[i], messages: messages, stream: false })
          });
          if (rl.status === 429) throw new Error('limite richieste (riprova tra ~20s)');
          if (rl.ok) return pickText(await rl.text());
        } catch (e) {
          if (e && /limite richieste/.test(e.message)) throw e;
        }
      }
    } catch (e) {
      if (e && /limite richieste/.test(e.message)) throw e;
    }
    try {
      const r = await fetch('https://text.pollinations.ai/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: messages })
      });
      if (r.ok) return pickText(await r.text());
      if (r.status === 402) throw new Error('pagamento richiesto (402), riprova tra poco');
    } catch (e) {
      if (e && /402|pagamento/.test(e.message)) throw e;
    }
    const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(q.slice(0, 400)));
    if (!r2.ok && r2.status === 402) throw new Error('pagamento richiesto (402), riprova tra poco');
    const t2 = await r2.text();
    return pickText(t2);
  }
  var typeTimer = 0;
  function typewrite(text, done) {
    clearInterval(typeTimer);
    txt.innerHTML = '';
    var span = document.createElement('span');
    span.className = 'caret';
    txt.appendChild(span);
    var i = 0;
    typeTimer = setInterval(function () {
      i += 3;
      span.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); span.classList.remove('caret'); if (done) done(); }
    }, 14);
  }
  zm.addEventListener('click', async function () {
    if (busy) return;
    const q = inp.value.trim();
    if (!q) { inp.focus(); return; }
    busy = true;
    zm.disabled = true;
    err.textContent = '';
    acts.hidden = true;
    document.getElementById('zen-continue').disabled = false;
    box.classList.add('open');
    txt.innerHTML = '';
    var wait = document.createElement('div');
    wait.textContent = 'ZEN 7.5 MAX sta pensando…';
    wait.style.cssText = 'font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9a9a9a;';
    txt.appendChild(wait);
    try {
      const a = await askZen(q);
      lastQ = q; lastA = a;
      typewrite(a, function () { acts.hidden = false; });
    } catch (e) {
      var em = (e && e.message) || '';
      err.textContent = /limite richieste/.test(em)
        ? 'ZEN è al limite gratuito (10 richieste/minuto): aspetta ~20 secondi e riprova.'
        : /402|pagamento|empty/.test(em)
        ? 'ZEN non risponde (' + em + '). Riprova tra poco.'
        : 'ZEN non risponde: controlla la rete o cerca su Google.';
      acts.hidden = false;
      document.getElementById('zen-continue').disabled = true;
      lastQ = q; lastA = '';
    }
    busy = false;
    zm.disabled = false;
  });
  document.getElementById('zen-continue').addEventListener('click', function () {
    if (!lastQ) return;
    const h = hist();
    h.push({ who: 'user', text: lastQ });
    if (lastA) h.push({ who: 'ai', text: lastA });
    saveHist(h);
    window.open('zenchat.html', '_blank');
  });
  document.getElementById('zen-google').addEventListener('click', function () {
    form.submit();
  });
})();
</script>
</body>
</html>
