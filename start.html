<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KOA</title>
<style>
  /* KOA 1.0.34 · Nuova scheda — Apple HIG */
  :root {
    color-scheme: dark light;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
    --label: #ffffff;
    --label-2: rgba(235, 235, 245, 0.62);
    --label-3: rgba(235, 235, 245, 0.36);
    --bg: #0c0c0e;
    --bg-elevated: #161618;
    --fill: rgba(120, 120, 128, 0.24);
    --fill-2: rgba(120, 120, 128, 0.16);
    --fill-3: rgba(120, 120, 128, 0.10);
    --hairline: rgba(255, 255, 255, 0.08);
    --hairline-strong: rgba(255, 255, 255, 0.15);
    --material: rgba(26, 26, 29, 0.72);
    --material-thick: rgba(22, 22, 25, 0.88);
    --tint: #ff8a5b;
    --tint-strong: #ff9d74;
    --tint-fill: rgba(255, 138, 91, 0.16);
    --tint-ring: rgba(255, 138, 91, 0.30);
    --on-tint: #1b0e08;
    --red: #ff453a;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.28), 0 18px 50px rgba(0, 0, 0, 0.32);
    --spring: linear(0, 0.018 1.5%, 0.075 3.4%, 0.23 6.2%, 0.52 10%, 0.79 14%,
              0.94 18%, 1.01 23%, 1.02 27%, 1.008 34%, 1 46%, 1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --label: #000000;
      --label-2: rgba(60, 60, 67, 0.62);
      --label-3: rgba(60, 60, 67, 0.38);
      --bg: #f5f5f7;
      --bg-elevated: #ffffff;
      --fill: rgba(118, 118, 128, 0.16);
      --fill-2: rgba(118, 118, 128, 0.11);
      --fill-3: rgba(118, 118, 128, 0.07);
      --hairline: rgba(0, 0, 0, 0.08);
      --hairline-strong: rgba(0, 0, 0, 0.14);
      --material: rgba(255, 255, 255, 0.76);
      --material-thick: rgba(255, 255, 255, 0.92);
      --tint: #cf4f1d;
      --tint-strong: #b9410f;
      --tint-fill: rgba(207, 79, 29, 0.10);
      --tint-ring: rgba(207, 79, 29, 0.24);
      --on-tint: #ffffff;
      --red: #d70015;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 16px 40px rgba(0, 0, 0, 0.10);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    letter-spacing: -0.08px;
    background: var(--bg);
    color: var(--label);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(680px 320px at 50% -140px, var(--tint-fill), transparent 70%);
  }
  ::selection { background: rgba(255, 138, 91, 0.28); color: var(--label); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--fill); border: 3px solid transparent; border-radius: 99px; background-clip: content-box; }

  .center-wrap {
    position: relative;
    z-index: 1;
    width: min(620px, 96vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  body > .center-wrap > img {
    width: 58px;
    height: 58px;
    border-radius: 15px;
    box-shadow: var(--shadow);
    animation: rise 520ms var(--spring) both;
  }
  h1 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--label-2);
    animation: rise 520ms var(--spring) 40ms both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }

  form {
    width: 100%;
    animation: rise 560ms var(--spring) 80ms both;
  }
  .aiwrap {
    width: 100%;
    background: var(--material);
    -webkit-backdrop-filter: blur(34px) saturate(180%);
    backdrop-filter: blur(34px) saturate(180%);
    border: 1px solid var(--hairline);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-color 160ms ease, box-shadow 240ms ease, background-color 160ms ease;
  }
  .aiwrap:focus-within {
    border-color: var(--tint);
    box-shadow: 0 0 0 4px var(--tint-ring), var(--shadow);
  }
  .bar-row { display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 16px; }
  .bar-row input {
    flex: 1;
    min-width: 0;
    height: 40px;
    border: none;
    background: transparent;
    color: var(--label);
    font-family: var(--font);
    font-size: 15px;
    letter-spacing: -0.15px;
    caret-color: var(--tint);
    outline: none;
  }
  .bar-row input::placeholder { color: var(--label-3); }

  #zenmode {
    flex-shrink: 0;
    height: 38px;
    padding: 0 17px;
    border: none;
    border-radius: 11px;
    background: var(--tint);
    color: var(--on-tint);
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: -0.05px;
    white-space: nowrap;
    cursor: default;
    transition: background-color 140ms ease, transform 100ms ease, opacity 140ms ease;
  }
  #zenmode:hover { background: var(--tint-strong); }
  #zenmode:active { transform: scale(0.96); }
  #zenmode:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
  #zenmode:disabled { opacity: 0.55; }
  #zenmode.zen-active { opacity: 0.62; }

  #zen-answer {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    margin: 0;
    padding: 0 18px;
    border-top: 1px solid transparent;
    transition: max-height 420ms var(--spring), opacity 220ms ease,
                padding 300ms var(--spring), margin 300ms var(--spring),
                border-color 200ms ease;
  }
  #zen-answer.open {
    max-height: 420px;
    opacity: 1;
    margin: 0 0 6px;
    padding: 12px 18px 16px;
    border-top-color: var(--hairline);
  }
  #zen-answer .who {
    margin-bottom: 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--tint);
  }
  #zen-text {
    max-height: 220px;
    overflow-y: auto;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--label);
    white-space: pre-wrap;
  }
  #zen-text .caret::after { content: "▍"; color: var(--tint); animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #zen-err { margin-top: 7px; font-size: 12px; color: var(--red); }
  #zen-err:empty { display: none; }
  .zen-actions { display: flex; gap: 8px; margin-top: 12px; }
  .zen-actions button {
    flex: 1;
    height: 34px;
    border-radius: 9px;
    border: 1px solid transparent;
    cursor: default;
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 500;
    transition: background-color 140ms ease, border-color 140ms ease,
                color 140ms ease, transform 100ms ease;
  }
  .zen-actions button:active { transform: scale(0.97); }
  #zen-continue { background: var(--tint); border-color: transparent; color: var(--on-tint); font-weight: 600; }
  #zen-continue:hover { background: var(--tint-strong); }
  #zen-continue:disabled { opacity: 0.45; }
  #zen-google { background: var(--fill-3); border-color: var(--hairline); color: var(--label); }
  #zen-google:hover { background: var(--fill-2); }

  .tiles {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    animation: rise 560ms var(--spring) 140ms both;
  }
  .tiles a {
    display: flex;
    align-items: center;
    height: 34px;
    padding: 0 16px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: var(--fill-3);
    color: var(--label-2);
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 500;
    transition: background-color 140ms ease, border-color 140ms ease,
                color 140ms ease, transform 100ms ease;
  }
  .tiles a:hover { background: var(--fill-2); border-color: var(--hairline-strong); color: var(--label); }
  .tiles a:active { transform: scale(0.96); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="center-wrap">
    <img src="assets/logo.png" alt="KOA" />
    <h1>KOA</h1>
    <form id="zoa-form" action="https://www.google.com/search" method="GET">
      <div class="aiwrap" id="aiwrap">
        <div class="bar-row">
          <input id="zoa-input" name="q" placeholder="Cerca o chiedi a ZEN…" autocomplete="off" autofocus />
          <button id="zenmode" type="button" title="Chiedi a ZEN 7.5 MAX">ZEN</button>
        </div>
        <div id="zen-answer">
          <div class="who">ZEN 7.5 MAX</div>
          <div id="zen-text"></div>
          <div id="zen-err"></div>
          <div class="zen-actions" id="zen-actions" hidden>
            <button id="zen-continue" type="button">Continua la conversazione</button>
            <button id="zen-google" type="button">Cerca su Google</button>
          </div>
        </div>
      </div>
    </form>
    <div class="tiles">
      <a href="https://www.google.com">Google</a>
      <a href="https://www.youtube.com">YouTube</a>
      <a href="https://github.com">GitHub</a>
      <a href="https://www.wikipedia.org">Wikipedia</a>
    </div>
  </div>
<script>
(function () {
  var inp = document.getElementById('zoa-input');
  var form = document.getElementById('zoa-form');
  var zm = document.getElementById('zenmode');
  var box = document.getElementById('zen-answer');
  var txt = document.getElementById('zen-text');
  var err = document.getElementById('zen-err');
  var acts = document.getElementById('zen-actions');
  if (!inp) return;
  // --- ZEN mode ---
  var busy = false, lastQ = '', lastA = '';
  function hist() {
    try { return JSON.parse(localStorage.getItem('koa.zenchat-hist') || '[]'); } catch (e) { return []; }
  }
  function saveHist(h) {
    try { localStorage.setItem('koa.zenchat-hist', JSON.stringify(h.slice(-30))); } catch (e) {}
  }
  async function askZen(q) {
    const body = { messages: [{ role: 'user', content: q.slice(0, 1500) }], model: 'openai' };
    try {
      const r = await fetch('https://text.pollinations.ai/', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
      if (r.ok) { const t = await r.text(); if (t.trim()) return t.trim(); }
    } catch (e) {}
    const r2 = await fetch('https://text.pollinations.ai/' + encodeURIComponent(q.slice(0, 400)));
    const t2 = await r2.text();
    if (!t2.trim()) throw new Error('vuoto');
    return t2.trim();
  }
  var typeTimer = 0;
  function typewrite(text, done) {
    clearInterval(typeTimer);
    txt.innerHTML = '';
    var span = document.createElement('span');
    span.className = 'caret';
    txt.appendChild(span);
    var i = 0;
    typeTimer = setInterval(function () {
      i += 3;
      span.textContent = text.slice(0, i);
      if (i >= text.length) { clearInterval(typeTimer); span.classList.remove('caret'); if (done) done(); }
    }, 14);
  }
  zm.addEventListener('click', async function () {
    if (busy) return;
    const q = inp.value.trim();
    if (!q) { inp.focus(); return; }
    busy = true;
    zm.disabled = true;
    zm.classList.add('zen-active');
    err.textContent = '';
    acts.hidden = true;
    document.getElementById('zen-continue').disabled = false;
    box.classList.add('open');
    txt.innerHTML = '';
    var wait = document.createElement('div');
    wait.textContent = 'ZEN 7.5 MAX sta pensando…';
    wait.style.cssText = 'font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9a9a9a;';
    txt.appendChild(wait);
    try {
      const a = await askZen(q);
      lastQ = q; lastA = a;
      typewrite(a, function () { acts.hidden = false; });
    } catch (e) {
      err.textContent = 'ZEN non risponde: controlla la rete o cerca su Google.';
      acts.hidden = false;
      document.getElementById('zen-continue').disabled = true;
      lastQ = q; lastA = '';
    }
    busy = false;
    zm.disabled = false;
    zm.classList.remove('zen-active');
  });
  document.getElementById('zen-continue').addEventListener('click', function () {
    if (!lastQ) return;
    const h = hist();
    h.push({ who: 'user', text: lastQ });
    if (lastA) h.push({ who: 'ai', text: lastA });
    saveHist(h);
    window.open('zenchat.html', '_blank');
  });
  document.getElementById('zen-google').addEventListener('click', function () {
    form.submit();
  });
})();
</script>
</body>
</html>
